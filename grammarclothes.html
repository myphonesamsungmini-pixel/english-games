<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This · That · These · Those: Clothes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fde7f1;--card:#fff;--ink:#5a2a52;--mut:#8d5a80;--near:#ffb3d3;--far:#8e63d8;--ok:#2fb583;--bad:#e0487a;--line:#f4c3dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1426;--card:#3d2138;--ink:#ffe9f4;--mut:#e0b3cf;--line:#5c3455}}
:root[data-theme="dark"]{--bg:#2a1426;--card:#3d2138;--ink:#ffe9f4;--mut:#e0b3cf;--line:#5c3455}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;font-size:18px;min-height:100%;background-image:radial-gradient(var(--line) 2px,transparent 2.5px);background-size:26px 26px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 12px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
nav button{flex:none;font:inherit;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rule{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:16px;line-height:1.5}
.rule b.n{background:var(--near);color:#5a2a52;border-radius:8px;padding:0 6px}
.rule b.f{background:var(--far);color:#fff;border-radius:8px;padding:0 6px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.scene{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px 10px;display:flex;align-items:center;justify-content:space-between;gap:4px;margin:10px 0;min-height:140px}
.me{text-align:center;font-size:54px;line-height:1}.me small,.obj small{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.fin{font-size:40px;flex:none}
.gap{flex:1;border-top:4px dotted var(--far);margin:0 6px}
.near{justify-content:center}.near .me{margin-right:34px}.obj{position:relative}.fin.on{position:absolute;left:-14px;top:36%;font-size:52px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.obj{text-align:center;line-height:1;flex:none}
.obj{background:#fff;border-radius:24px;padding:6px;box-shadow:0 3px 0 var(--line)}.obj small{color:#8d5a80}.obj img{display:block;width:120px;height:120px}.far .obj img{width:56px;height:56px}
.near .fin{filter:none}
.prompt{font-size:30px;text-align:center;margin:12px 0;font-weight:500}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--ink);color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.opts button,.chip,.go{font:inherit;font-size:22px;font-weight:500;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:22px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.opts button.sel{background:var(--near);color:#5a2a52}
.opts button.ok,.chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.opts button.bad{animation:none}}
.fb{min-height:48px;text-align:center;font-size:17px;margin:6px 0}
.go{background:var(--far);color:#fff;border-color:var(--far);box-shadow:0 4px 0 #5b3a96}
.row{text-align:center;margin:10px 0}
.ans{min-height:62px;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font-size:20px;padding:6px 14px}
.done{text-align:center;background:var(--card);border-radius:20px;padding:24px;margin-top:14px}
.done .big{font-size:60px}
.skip{font:inherit;font-size:18px;border:3px solid var(--far);background:transparent;color:var(--far);border-radius:22px;padding:8px 26px;cursor:pointer}
button:focus-visible{outline:4px solid var(--far);outline-offset:2px}
</style></head><body><main>
