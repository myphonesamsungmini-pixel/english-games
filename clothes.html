dius:20px;background:#f0fbfc;min-height:190px;margin:15px 0 22px;flex-direction:column;padding:18px;text-align:center}.emoji{font-size:clamp(68px,10vw,110px);line-height:1.3}.word{font-size:clamp(30px,5vw,46px);font-weight:900;color:#084d65}.tiny{font-size:14px;color:#66808b}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice,.action{border:2px solid var(--line);background:white;border-radius:15px;padding:16px;font-size:18px;font-weight:800;color:var(--dark);transition:transform .12s,background .12s}.choice:hover:not(:disabled),.action:hover:not(:disabled){transform:translateY(-2px);background:#eefbfc}.choice:disabled{cursor:default}.choice.correct{background:#cbf8e5;border-color:#33b886}.choice.wrong{background:#ffe2e8;border-color:#e87992}.feedback{min-height:32px;margin:14px 0;font-weight:800}.good{color:#008561}.bad{color:#c43d62}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.primary{background:var(--teal);color:white;border:2px solid var(--teal);border-radius:13px;padding:13px 23px;font-weight:900}.primary:hover{background:#007f91}.secondary{background:white;color:#176177;border:2px solid #b7e0e4;border-radius:13px;padding:12px 18px;font-weight:800}.flash{min-height:260px;background:linear-gradient(145deg,#dff8f9,#f9ecf6);border:3px solid #a8dfe5;border-radius:23px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;cursor:pointer;user-select:none;padding:24px}.flash .emoji{font-size:86px}.pill{display:inline-block;background:#fff1b8;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:800}.typing{width:100%;max-width:440px;padding:16px;font:800 22px ui-rounded,system-ui;border:2px solid #9ed6dc;border-radius:15px;outline:0}.typing:focus{border-color:var(--teal)}.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.vocab-item{border:2px solid #d8ecef;border-radius:16px;padding:14px;text-align:center;background:#fbffff}.vocab-item .emoji{font-size:48px}.vocab-item strong{display:block;font-size:19px}.vocab-item button{border:0;background:#e4f5f7;padding:7px 11px;border-radius:8px;margin-top:8px}.match-layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.match-col{display:grid;gap:10px}.match{border:2px solid #bedee3;min-height:70px;background:white;border-radius:14px;font-size:20px;font-weight:800}.match.selected{border-color:#e7a41c;background:#fff3ce}.match.solved{border-color:#91e7c1;background:#ddf9ec;color:#477665;opacity:.7}.match .emoji{font-size:36px}.instructions{margin-top:0}.footer-note{text-align:center;margin-top:22px;color:#557883;font-size:14px}.stars{font-size:32px;letter-spacing:3px}.summary{text-align:center;padding:25px 5px}.summary h2{font-size:32px}.hidden{display:none!important}@media(max-width:530px){.choices{grid-template-columns:1fr}.panel{padding:18px}.mode{flex:1 1 42%;padding:11px 7px;font-size:14px}.match{min-height:60px}}

/* Make a Sentence exercise */
.scene-wrap{position:relative;overflow:hidden;border-radius:17px;background:#ecedf1;border:2px solid #c9e6ed;max-width:880px;margin:10px auto 16px}
.scene-wrap img{display:block;width:100%;height:auto}
.scene-highlight{position:absolute;top:3%;bottom:3%;width:16.666%;border:4px solid #ffcf35;box-shadow:inset 0 0 0 2px #fff,0 0 14px #2226;border-radius:18px;pointer-events:none;transition:left .2s}
.scene-number{position:absolute;top:10px;left:10px;background:#ffcf35;color:#26323a;border-radius:100px;padding:7px 13px;font-weight:900;box-shadow:0 2px 8px #0002}
.sentence-target{background:#eefbfc;border:2px dashed #86d2da;border-radius:14px;min-height:78px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:14px 0}
.word-tiles{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tile{font-weight:900;font-size:clamp(15px,2.2vw,20px);border:2px solid #82cfd7;background:white;border-radius:12px;padding:10px 14px;color:#15455b;box-shadow:0 3px #d6e9ec;min-height:48px}
.tile:disabled{opacity:.3;cursor:default}.tile.chosen{border-color:#29aebc;background:#dcf8f9}.sentence-placeholder{color:#66828d;font-weight:800}.fixed-period{font-size:28px;font-weight:900;color:#15455b;padding:0 5px;align-self:center}
.scene-help{font-size:14px;color:#526f81;text-align:center}.sentence-feedback{text-align:center;min-height:28px;font-size:18px;font-weight:800}
@media(max-width:570px){.scene-highlight{border-width:2px;border-radius:7px}.scene-number{font-size:12px;padding:5px 8px}.tile{padding:9px}}
.picture-choices{margin-top:18px}.picture-choice{display:flex;align-items:center;justify-content:center;min-height:135px}.picture-choice .clothing-picture.small{width:140px;height:125px}@media(max-width:530px){.picture-choices{grid-template-columns:repeat(2,minmax(0,1fr))}.picture-choice .clothing-picture.small{width:100%;height:105px}.picture-choice{padding:9px;min-height:120px}}

function card(){const it=deck[index];panel.innerHTML=h('Flashcards',`Card ${index+1} of ${deck.length}`)+bar()+`<h2>Look, think, and flip!</h2><p class="muted instructions">Назови предмет одежды на английском. Нажми на карточку, чтобы проверить себя. Нажми Hear word, послушай и повтори слово. Если вспомнил слово, нажми I remembered! Если нет — Practise again.</p><div class="flash" id="flip" tabindex="0" role="button" aria-label="Flip flashcard"><span class="pill">${flipped?'Answer':'Picture clue'}</span>${pic(it,"large")}${flipped?`<span class="word">${esc(it.word)}</span><span>${esc(it.hint)}</span>`:'<span class="tiny">Tap to reveal the word</span>'}</div><div class="actions"><button class="secondary" id="listen">🔊 Hear word</button>${flipped?'<button class="secondary" id="hard">🔁 Practise again</button><button class="primary" id="got">✅ I remembered!</button>':'<button class="primary" id="reveal">Reveal answer</button>'}</div>`;const flip=()=>{flipped=!flipped;card()};$('#flip').onclick=flip;$('#flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('#listen').onclick=()=>speak(it.word);if(flipped){$('#hard').onclick=()=>{mistake(it.word);index++;flipped=false;render()};$('#got').onclick=()=>{award(5);learned(it.word);index++;flipped=false;render()}}else $('#reveal').onclick=flip}
function opts(it){return shuffle([it,...shuffle(items.filter(x=>x.word!==it.word)).slice(0,3)])}function quiz(){const it=deck[index],options=opts(it);panel.innerHTML=h(mode==='review'?'Tricky word training':'Picture quiz',`Question ${index+1} of ${deck.length}`)+bar()+`<h2>Which word matches the clue?</h2><p class="muted">${mode==='review'?'Повтори слова, в которых были ошибки. Посмотри на картинку и выбери правильное слово.':'Посмотри на картинку и выбери правильное английское слово.'} Затем нажми Next.</p><div class="hero">${pic(it,"large")}<span class="tiny">${esc(it.hint)}</span></div><div class="choices">${options.map(o=>`<button class="choice" data-answer="${esc(o.word)}">${esc(o.word)}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="assertive"></div><div class="actions"><button class="primary hidden" id="next">Next →</button></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.dataset.answer===it.word;document.querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(c.dataset.answer===it.word)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});if(ok){award(10);learned(it.word)}else mistake(it.word);$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✅ Correct! Excellent!':`Not quite. The answer is ${it.word}.`;speak(it.word);$('#next').classList.remove('hidden')});answered=false;$('#next').onclick=()=>{index++;answered=false;render()}}

 function paint(){
  $('#sentenceTarget').innerHTML=sentencePicked.length?sentencePicked.map((t,i)=>`<button class="tile chosen" data-picked="${i}" aria-label="Remove ${esc(t.word)}">${esc(t.word)}</button>`).join(''):'<span class="sentence-placeholder">Нажимай на слова внизу, чтобы составить предложение</span>';
  $('#sentenceTarget').insertAdjacentHTML('beforeend', '<span class="fixed-period" aria-label="Full stop">.</span>');
  $('#tileBank').innerHTML=sentenceTiles.map(t=>`<button class="tile" data-id="${t.id}" ${sentencePicked.some(p=>p.id===t.id)?'disabled':''}>${esc(t.word)}</button>`).join('');
  document.querySelectorAll('#tileBank .tile').forEach(b=>b.onclick=()=>{if(sentenceDone)return;sentencePicked.push(sentenceTiles.find(x=>x.id===Number(b.dataset.id)));paint()});
  document.querySelectorAll('#sentenceTarget .tile').forEach(b=>b.onclick=()=>{if(sentenceDone)return;sentencePicked.splice(Number(b.dataset.picked),1);paint()});
 }
 paint();
 $('#sentenceUndo').onclick=()=>{if(!sentenceDone){sentencePicked.pop();paint()}};
 $('#sentenceReset').onclick=()=>{if(!sentenceDone){sentencePicked=[];paint()}};
 $('#sentenceCheck').onclick=()=>{
  if(sentenceDone)return;
  const got=sentencePicked.map(t=>t.word).join(' '),expected=answer.join(' ');
  if(got===expected){sentenceDone=true;award(15);$('#sentenceFeedback').textContent='✅ Great sentence! '+answer.join(' ')+'.';$('#sentenceFeedback').className='sentence-feedback good';$('#sentenceCheck').classList.add('hidden');$('#sentenceNext').classList.remove('hidden');$('#sentenceUndo').disabled=true;$('#sentenceReset').disabled=true;speak(answer.join(' ') + '.');}
  else{$('#sentenceFeedback').textContent=sentencePicked.length<4?'Добавь все нужные слова.':'Попробуй ещё раз! Проверь порядок слов и is / are.';$('#sentenceFeedback').className='sentence-feedback bad';}
 };
 $('#sentenceNext').onclick=()=>{index++;sentenceGame()};
}

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));save();start('cards');
</script></body></html>
