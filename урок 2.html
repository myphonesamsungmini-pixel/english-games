<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Beginner English: Nationalities & Negatives</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#222;--mut:#6b6b6b;--ac:#2f6fed;--ok:#1f9d55;--bad:#d64545;--bd:#e2ddd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--card:#23252b;--tx:#eee;--mut:#9a9aa3;--ac:#6c9bff;--ok:#44c27b;--bad:#f06a6a;--bd:#383b44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181c;--card:#23252b;--tx:#eee;--mut:#9a9aa3;--ac:#6c9bff;--ok:#44c27b;--bad:#f06a6a;--bd:#383b44;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}h2{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.opts.one{grid-template-columns:1fr}
.opts button img{width:100%;max-width:130px;border-radius:8px;display:block;margin:auto}
.pic{display:block;margin:0 auto;max-width:260px;width:70%;border-radius:12px}
.big{font-size:28px;text-align:center;margin:10px 0}.mut{color:var(--mut);font-size:14px}
input[type=text],select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:8px;text-align:left}th{background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.fb{margin:10px 0;font-weight:600}
.menu button{display:block;width:100%;text-align:left;margin:6px 0}
.sc{overflow-x:auto}
.slots{min-height:52px;font-size:30px;letter-spacing:.15em;text-align:center;border-bottom:2px solid var(--bd);margin:12px 0}.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.tiles button{font-size:22px;min-width:46px}.tiles button:disabled{opacity:.25}
</style></head><body><div id="app"></div>

let people=[];function loadP(){let s=[];try{s=JSON.parse(localStorage.getItem("people")||"[]")}catch(e){}people=D.people.map((img,i)=>Object.assign({img,g:"",n:""},s[i]||{}))}

function menu(){const S=[["1. Национальности",[["Слушай и повторяй",()=>cards(NAT,n=>n.w,n=>"from "+n.c)],["Картинка \u2192 национальность",()=>quiz("Кто это?",qPic(NAT,"w"),menu)],["Слушай \u2192 выбери картинку",()=>quiz("Послушай и выбери картинку",qListen(NAT,"w"),menu)],["Собери слово из букв",()=>quiz("Собери слово из букв",qAna(NAT,"w"),menu)],["Посмотри и напиши",()=>quiz("Напиши национальность",qType(NAT,"w"),menu)]]],
["2. am not / isn\u2019t / aren\u2019t",[["Памятка",memo],["Грамматика: выбери форму",()=>quiz("Выбери отрицательную форму",qGap(),menu)],["Фото: отрицание + утверждение",()=>quiz("Скажи правильно",qNeg(),menu)],["Известные люди: напиши 2 предложения",famous]]],
["3. Выражения из наших уроков",[["Слушай и повторяй",()=>cards(PH,p=>p.w,()=>"")],["Картинка \u2192 выражение",()=>quiz("Какое это выражение?",qPic(PH,"w"),menu)],["Слушай \u2192 выбери картинку",()=>quiz("Послушай и выбери картинку",qListen(PH,"w"),menu)],["Закончи выражение",()=>quiz("Выбери пропущенное слово",qCloze(),menu)],["Посмотри и напиши",()=>quiz("Напиши выражение",qType(PH,"w",1),menu)]]]];

function cards(L,f,sub){let i=0;(function r(){const x=L[i];app.innerHTML=`<button onclick="menu()">\u2190 Меню</button><div class=bar><i style="width:${(i+1)/L.length*100}%"></i></div><div class=card><img class=pic src="${x.img}"><div class=big>${esc(f(x))}</div><div class="mut" style="text-align:center">${esc(sub(x))}</div><div class=row style="justify-content:center;margin-top:10px"><button class=p onclick="say('${f(x).replace(/'/g,"\\'")}')">\ud83d\udd0a Слушать</button><button id=pv>\u2190</button><button id=nx>${i<L.length-1?"Далее →":"Готово ✓"}</button></div><p class=mut style="text-align:center">${i+1} / ${L.length} \u2014 послушай и повтори вслух 3 раза</p></div>`;
$("#pv").onclick=()=>{if(i>0){i--;r()}};$("#nx").onclick=()=>{if(i<L.length-1){i++;r()}else menu()};say(f(x))})()}
window.menu=menu;
function qPic(L,k){return sh(L).map(x=>({img:x.img,prompt:"",opts:sh([x,...sh(L.filter(y=>y!=x)).slice(0,3)]).map(y=>y[k]),ans:x[k],say:x[k]}))}
function qListen(L,k){return sh(L).map(x=>({auto:x[k],prompt:"Послушай",optImg:1,opts:sh([x,...sh(L.filter(y=>y!=x)).slice(0,3)]).map(y=>y.img),ans:x.img,say:x[k],wide:0}))}
function qType(L,k,ph){return sh(L).map(x=>({img:x.img,prompt:"Напиши:",type:1,ans:[x[k]],say:x[k],hint:ph?x[k].split(" ").map(w=>w[0]+"_".repeat(w.length-1)).join(" "):x[k][0]+"_".repeat(x[k].length-1)}))}
function qAna(L,k){return sh(L).map(x=>{const w=x[k].toLowerCase();let t;do{t=sh(w.split(""))}while(t.join("")==w);return{img:x.img,prompt:"Собери слово из букв:",ana:1,tiles:t,ans:[x[k]],say:x[k]}})}
function qCloze(){const C=[["I grew up ___ his films","on",["in","at","of"],"I grew up on his films"],["He ___ in a film","acted",["act","acts","acting"],"He acted in"],["for the ___ time","first",["one","once","fist"],"for the first time"],["do martial ___","arts",["art","artist","arty"],"do martial arts"],["She is an ___","actress",["actor","act","action"],"an actress"],["He is a ___","footballer",["football","footballs","foot"],"a footballer"]];return sh(C).map(c=>({prompt:c[0],opts:sh([c[1],...c[2]]),ans:c[1],say:c[3]}))}
function qGap(){const P=[["I","'m not","I am not"],["You","aren't","You are not"],["He","isn't","He is not"],["She","isn't","She is not"],["It","isn't","It is not"],["We","aren't","We are not"],["They","aren't","They are not"]];const O=["'m not","isn't","aren't"];return sh(P).map(p=>({prompt:`${p[0]} ___ Russian.`,opts:O.slice(),ans:p[1],say:p[0]+" "+p[1].replace("'m","'m")+" Russian",fb:"Полная форма: "+p[2]}))}
function qNeg(){const bad=(a,b)=>a==b||(["British","English"].includes(a)&&["British","English"].includes(b));return sh(NAT).slice(0,10).map(n=>{const v=pron(n.g),w=sh(NAT.filter(x=>!bad(x.w,n.w)))[0].w,o=sh(NAT.filter(x=>!bad(x.w,n.w)&&!bad(x.w,w)))[0].w;return{img:n.img,prompt:"Посмотри на картинку и выбери правильную форму:",opts:sh([`${v} isn't ${w}.`,`${v} aren't ${w}.`,`${v} am not ${w}.`]),ans:`${v} isn't ${w}.`,say:`${v} isn't ${w}.`,fb:`Полная форма: ${v} is not ${w}.`,next:{prompt:"А теперь скажи, кто это на самом деле:",opts:sh([n.w,w,o]).map(x=>`${v} is ${x}.`),ans:`${v} is ${n.w}.`,say:`${v} is ${n.w}.`}}})}
function quiz(title,qs,back){let i=0,sc=0,list=[];qs.forEach(q=>{list.push(q);if(q.next)list.push(Object.assign({img:q.img,stage2:1},q.next))});qs=list;
