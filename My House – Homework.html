<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My House – Homework</title>
<style>
:root{--bg:#fff6e8;--card:#fff;--tx:#2a2a3c;--ac:#ff7a59;--ok:#2fb36b;--bad:#e5484d;--mut:#6b6b80;--bd:#f1dfc6;--btn:#fff1de;--hd:#ff7a59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2a;--card:#2a2840;--tx:#f3f0ff;--mut:#b4b0cc;--bd:#43405e;--btn:#38355a;--hd:#d9583b}}
:root[data-theme="dark"]{--bg:#1d1b2a;--card:#2a2840;--tx:#f3f0ff;--mut:#b4b0cc;--bd:#43405e;--btn:#38355a;--hd:#d9583b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
h1{font-size:1.3rem;margin:0}#score{font-weight:700;font-size:1.2rem;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:20px}
main{max-width:760px;margin:0 auto;padding:12px}
h2.part{margin:26px 4px 6px;font-size:1.35rem}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:1.15rem}.instr,.hint{color:var(--mut);margin:0 0 10px;font-size:.95rem}
.hint{background:var(--btn);padding:8px 12px;border-radius:12px;color:var(--tx)}
.prog{font-size:.85rem;color:var(--mut);margin-bottom:4px}.q{font-size:1.2rem;margin:6px 0 10px}.ru{color:var(--mut);font-size:.95rem}
.bl{display:inline-block;min-width:48px;border-bottom:3px solid var(--ac);text-align:center;color:var(--ac);font-weight:700}
.stage{position:relative;margin:0 0 10px;border-radius:14px;overflow:hidden;line-height:0}.stage img{width:100%;height:auto;display:block}
.ring{display:none;position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border:5px solid #ff2d6f;border-radius:50%;pointer-events:none;animation:pl 1s infinite;box-shadow:0 0 0 3px #fff8}
@keyframes pl{50%{transform:translate(-50%,-50%) scale(1.2)}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.opt,.say,.go,.tile{min-height:48px;padding:8px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--btn)}
.opt:hover,.tile:hover,.say:hover{border-color:var(--ac)}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;animation:sh .35s}
.go{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.txt{font:inherit;width:100%;max-width:300px;padding:10px 12px;margin:8px 8px 8px 0;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.slots span{width:34px;height:42px;border-bottom:3px solid var(--bd);text-align:center;font-size:1.5rem;font-weight:700}.slots .on{color:var(--ok);border-color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{width:48px;font-size:1.3rem;font-weight:700;text-transform:lowercase}
.fin{font-size:1.4rem;text-align:center;padding:14px;color:var(--ok);font-weight:700}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:1.4em;color:var(--mut);margin:4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px;border:2px solid var(--bd);border-radius:14px;background:var(--btn);font-size:1.1rem}
</style></head><body>

</main>

let total=0,got=0;
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const upd=()=>{scoreEl.textContent="⭐ "+got+" / "+total};
function snd(ok){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?660:200;g.gain.value=.08;o.start();o.stop(a.currentTime+(ok?.15:.25))}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function stage(src){const w=$("div","stage"),im=new Image();im.src=src;im.alt="";const r=$("div","ring");w.append(im,r);w.ring=(x,y,s)=>{r.style.width=(s||11)+"%";r.style.left=x+"%";r.style.top=y+"%";r.style.display="block"};w.noring=()=>{r.style.display="none"};return w}
function exercise(c){
 const sec=$("section","card");sec.append($("h2","",c.title),$("p","instr",c.instr));
 if(c.hint)sec.append($("p","hint",c.hint));
 const ctx={};if(c.img){ctx.st=stage(c.img);sec.append(ctx.st)}
 const body=$("div");sec.append(body);app.append(sec);
 total+=c.items.length;upd();let i=0;
 ctx.done=first=>{if(first){got++;upd()}snd(true);setTimeout(()=>{i++;next()},900)};
 ctx.bad=()=>snd(false);
 function next(){body.innerHTML="";if(i>=c.items.length){body.append($("div","fin","🎉 Молодец!"));return}
  body.append($("div","prog","Вопрос "+(i+1)+" из "+c.items.length));c.render(c.items[i],body,ctx)}
 next();
}
function choice(it,b,ctx,opts){let tried=false;b.append($("p","q",it.q));const row=$("div","opts");
 opts.forEach(o=>{const x=$("button","opt",o);x.onclick=()=>{if(o===it.a){x.classList.add("ok");row.querySelectorAll("button").forEach(y=>y.disabled=true);ctx.done(!tried)}else{tried=true;x.classList.add("bad");x.disabled=true;ctx.bad()}};row.append(x)});b.append(row)}

function makeWord(){exercise({title:"Собери слово",instr:"Найди предмет в красном кружке и собери его название по буквам. Нажимай буквы по порядку.",img:IMG.house,items:shuffle(F),render:(it,b,ctx)=>{
 let tried=false,pos=0;const w=it.w;ctx.st.ring(it.x,it.y,6);
 const sp=$("button","say","🔊");sp.onclick=()=>say(w);
 const slots=$("div","slots",w.split("").map(()=>"<span>&nbsp;</span>").join("")),tiles=$("div","tiles");
 shuffle(w.split("")).forEach(ch=>{const t=$("button","tile",ch);t.onclick=()=>{if(t.disabled)return;
  if(ch===w[pos]){t.disabled=true;slots.children[pos].textContent=ch;slots.children[pos].classList.add("on");pos++;if(pos===w.length)ctx.done(!tried)}
  else{tried=true;t.classList.add("bad");setTimeout(()=>t.classList.remove("bad"),400);ctx.bad()}};tiles.append(t)});
 b.append($("p","q","Что это? <span class='ru'>("+it.ru+")</span>"),sp,slots,tiles)}})}

const PRU={"behind":"за, позади","in":"в","in front of":"перед","next to":"рядом с","on":"на","under":"под"},PL=Object.keys(PRU);
const BALL=(x,y)=>"<circle cx='"+x+"' cy='"+y+"' r='10' fill='#e8501f' stroke='#a8340f' stroke-width='2'/>";
const BOX=(x,y,o)=>"<rect x='"+x+"' y='"+y+"' width='40' height='40' rx='4' fill='#6fb3e0' fill-opacity='"+o+"' stroke='#2b6c99' stroke-width='3'/>";
function pic(p){let s;
 if(p==="on")s=BOX(40,40,1)+BALL(60,30);
 else if(p==="under")s=BOX(40,15,1)+BALL(60,72);
 else if(p==="in")s=BALL(60,57)+BOX(40,35,.4);
 else if(p==="behind")s=BALL(76,56)+BOX(30,35,1);
 else if(p==="next to")s=BOX(25,40,1)+BALL(88,70);
 else s=BOX(40,28,1)+BALL(60,64);
