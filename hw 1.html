en}\u003c/button>`;}).join('')}\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"feedback\" id=\"msg\">${paired.size===6?'Excellent! All 6 matched 🎉':''}\u003c/div>\n   \u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" id=\"restartMatch\">New round\u003c/button>\u003cspan class=\"score\">${paired.size}/6 matched\u003c/span>\u003c/div>`;\n  document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{pick=b.dataset.photo;match()});\n  document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{\n    if(!pick){$('#msg').textContent='Сначала выберите картинку 👈'; return;}\n    if(b.dataset.word===pick){paired.add(pick); pick=null; match();}\n    else {$('#msg').textContent='Try again! Look carefully 👀'; b.classList.add('bad');}\n  });\n  $('#restartMatch').onclick=()=>{pick=null; paired.clear(); order=[]; match();};\n}\n\nconst SENTENCES=[['I','am','in','a','good','mood.'],['I','am','in','a','bad','mood.']];\nlet sentenceNumber=0,sentenceParts=[];\nfunction buildSentence(){\n const words=SENTENCES[sentenceNumber],pool=[...words.keys()].sort((a,b)=>(a*7+3)%11-(b*7+3)%11);\n const correct=sentenceParts.length===words.length && sentenceParts.every((v,i)=>v===i);\n $('#panel').innerHTML=head('Build the sentence','Соберите предложение из слов. Нажмите на выбранное слово, чтобы убрать его.')+\n `\u003cdiv class=\"solo\">\u003cspan class=\"smallTag\">Sentence ${sentenceNumber+1} / 2\u003c/span>\u003cdiv class=\"questionLine\">${sentenceParts.map((j,i)=>`\u003cbutton class=\"token active\" data-remove=\"${i}\">${words[j]} ×\u003c/button>`).join('')||'\u003cspan class=\"dim\">Your sentence goes here…\u003c/span>'}\u003c/div>\u003cdiv class=\"wordbank\">${pool.map(j=>`\u003cbutton class=\"token\" data-add=\"${j}\" ${sentenceParts.includes(j)?'disabled':''}>${words[j]}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"feedback\">${correct?'✓ '+words.join(' '):''}\u003c/div>\u003cdiv class=\"controls\" style=\"justify-content:center\">\u003cbutton class=\"btn secondary\" id=\"clearQ\">Clear\u003c/button>${correct?'\u003cbutton class=\"btn\" id=\"nextSentence\">'+(sentenceNumber===1?'Try again ↻':'Next sentence →')+'\u003c/button>':''}\u003c/div>\u003c/div>`;\n document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{sentenceParts.push(+b.dataset.add);buildSentence()});\n document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{sentenceParts.splice(+b.dataset.remove,1);buildSentence()});\n $('#clearQ').onclick=()=>{sentenceParts=[];buildSentence()};\n const next=$('#nextSentence');if(next)next.onclick=()=>{sentenceNumber=(sentenceNumber+1)%2;sentenceParts=[];buildSentence()};\n}\nfunction dialogues(){\n let d=DATA[dialogueRound%DATA.length];\n $('#panel').innerHTML=head('Ask & Answer','Работа в парах: один студент спрашивает, другой отвечает по картинке. Затем поменяйтесь ролями.')+\n `\u003cdiv class=\"solo\">\u003cspan class=\"smallTag\">Dialogue ${dialogueRound%DATA.length+1} / ${DATA.length}\u003c/span>${picture(d,true)}\u003cdiv class=\"dialogue\">\u003cdiv class=\"speaker\">A\u003c/div>\u003cdiv>How do you feel?\u003c/div>\u003c/div>\u003cdiv class=\"dialogue\">\u003cdiv class=\"speaker alt\">B\u003c/div>\u003cdiv>${dialogueReveal?d.en:'I’m …'}\u003c/div>\u003c/div>${dialogueReveal?`\u003cdiv class=\"tip\">${d.ru}\u003c/div>`:''}\u003cdiv class=\"controls\" style=\"justify-content:center\">\u003cbutton class=\"btn secondary\" id=\"revealDialogue\">${dialogueReveal?'Скрыть ответ':'Показать ответ'}\u003c/button>\u003cbutton class=\"btn\" id=\"nextDialogue\">Next dialogue →\u003c/button>\u003c/div>\u003c/div>`;\n $('#revealDialogue').onclick=()=>{dialogueReveal=!dialogueReveal;dialogues()};\n $('#nextDialogue').onclick=()=>{dialogueRound++;dialogueReveal=false;dialogues()};\n}\n\nfunction speak(){\n  let d = DATA[speakIndex % DATA.length];\n  $('#panel').innerHTML = head('Speak','Посмотрите на картинку и скажите фразу вслух. Потом откройте ответ и проверьте себя.') +\n  `\u003cdiv class=\"solo\">\u003cspan class=\"smallTag\">Speaking ${speakIndex%DATA.length+1} / 6\u003c/span>${picture(d,true)}\u003cdiv class=\"soloQuestion\">How do you feel?\u003c/div>\u003cbutton class=\"btn secondary\" id=\"revealS\">${speakRevealed?'Hide answer':'Show answer'}\u003c/button>${speakRevealed?`\u003cdiv class=\"reveal\">${d.en}\u003c/div>\u003cdiv class=\"tip\">${d.ru}\u003c/div>`:''}\u003cdiv class=\"controls\" style=\"justify-content:center\">\u003cbutton class=\"btn\" id=\"nextS\">Next picture →\u003c/button>\u003cbutton class=\"btn light\" id=\"shuffleS\">Shuffle\u003c/button>\u003c/div>\u003c/div>`;\n  $('#revealS').onclick=()=>{speakRevealed=!speakRevealed; speak();};\n  $('#nextS').onclick=()=>{speakIndex++; speakRevealed=false; speak();};\n  $('#shuffleS').onclick=()=>{speakIndex=Math.floor(Math.random()*DATA.length); speakRevealed=false; speak();};\n}\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Where are you from?\u003c/title>\n\u003cstyle>\n:root{--ink:#f4f1ff;--dim:#b5aedc;--bg:#0b0820;--panel:#15103a;--line:#3b3380;--hot:#ff5fa8;--cyan:#4fd8e6;--ok:#4ade80;--bad:#ff6b6b}\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%}\nbody{font-family:\"Outfit\",\"Poppins\",\"Segoe UI\",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}\n.aurora{position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 20% 20%,#6d4fe0aa,transparent 70%),radial-gradient(35% 35% at 80% 30%,#17b6c477,transparent 70%),radial-gradient(40% 40% at 50% 90%,#d63fa05e,transparent 70%);animation:drift 18s ease-in-out infinite alternate}\n@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg) scale(1.1)}}\n.bar{position:fixed;left:0;right:0;height:3vh;background:#000;z-index:5}.bar.t{top:0}.bar.b{bottom:0}\n.wrap{max-width:760px;margin:0 auto;padding:7vh 18px 8vh}\nh1{font-weight:200;font-size:clamp(34px,8vw,64px);letter-spacing:.02em;margin:0;line-height:1.05;animation:title 2.4s cubic-bezier(.2,.7,.2,1) both}\n@keyframes title{from{opacity:0;letter-spacing:.35em;filter:blur(10px)}}\n.sub{color:var(--dim);margin:8px 0 22px;animation:title 2.4s .3s both}\nnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}\nnav button{flex:1;min-width:110px;padding:11px 8px;background:#ffffff0d;border:1px solid var(--line);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer;transition:.2s}\nnav button.on{background:linear-gradient(135deg,#7b5cf0,#d63fa0);border-color:transparent}\nbutton:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}\n.stage{perspective:1200px}\n.card{position:relative;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.2,1)}\n.card.flip{transform:rotateY(180deg)}\n.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 30px 60px #0008,inset 0 0 80px #7b5cf018;padding:16px;text-align:center}\n.face.back{transform:rotateY(180deg)}\n.flag{width:170px;border-radius:6px;box-shadow:0 10px 30px #0009;display:block}\n.flag.sm{width:100%}\n.name{font-size:clamp(30px,7vw,48px);font-weight:300}\n.ru{font-size:26px}.say{color:var(--cyan);font-size:22px;letter-spacing:.04em}\n.ex{color:var(--dim);font-style:italic}\n.hint{color:var(--dim);font-size:13px}\n.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}\n.btn{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:#ffffff10;color:var(--ink);font:inherit;cursor:pointer}\n.btn:hover{border-color:var(--cyan)}\n.btn.main{background:linear-gradient(135deg,#7b5cf0,#d63fa0);border:0}\n.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}\n.strip button{padding:5px;background:none;border:2px solid transparent;border-radius:6px;cursor:pointer;opacity:.55;transition:.2s}\n.strip button.on,.strip button:hover{opacity:1;border-color:var(--hot)}\n.prog{height:4px;background:#ffffff18;border-radius:4px;margin-bottom:18px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--hot));transition:width .5s}\n.q{text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}\n.q .big{font-size:clamp(28px,6vw,42px);font-weight:300}\n.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opt{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;transition:.15s}\n.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}\n.opt.ok{background:#14532d;border-color:var(--ok)}.opt.no{background:#5b1a1a;border-color:var(--bad);animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.opt.flagopt{padding:8px}\n.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:50px}\n.tile{min-width:44px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:22px;cursor:pointer}\n.slot{border-bottom:3px solid var(--hot);background:none;cursor:default}\n.slot.ok{border-color:var(--ok)}.slot.no{border-color:var(--bad)}\n.fb{min-height:28px;text-align:center;margin:12px 0;font-size:18px}\n.score{text-align:center;padding:40px 10px}.score .n{font-size:80px;font-weight:200}\n.sd{color:var(--dim);font-size:13px;text-align:center;margin-top:24px}\n@media(max-width:520px){.card{height:310px}.flag{width:140px}.strip{grid-template-columns:repeat(7,1fr)}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\nbody{background:t
