 const p=Math.round(100*tot/max);
 const L=p>=92?["🏆 Excellent! / Отлично!","5","Ты супер! Тема усвоена на отлично."]:p>=76?["🌟 Very good! / Очень хорошо!","4","Отличный результат, осталось поправить пару мелочей."]:p>=56?["👍 Good / Хорошо","3","Неплохо, но есть что повторить — смотри советы ниже."]:p>=36?["📚 Needs revision / Нужно повторить","2","Пока много ошибок. Повтори материал и попробуй ещё раз!"]:["💪 Let’s practise more! / Давай потренируемся!","2","Не расстраивайся! Перечитай правила и попробуй снова."];
 const weak=SECS.filter((S,i)=>!S.bonus&&sc[i]/S.max<0.7).map(S=>`<li><b>${S.n}:</b> ${S.topic}</li>`).join("");
 const name=$("#nm").value.trim()||"—";
 $("#res").innerHTML=`<div style="color:var(--mut)">📅 ${new Date().toLocaleDateString("ru-RU")} · 👤 <b style="color:var(--tx)">${name}</b></div>
 <div class="big">${tot} / ${max}</div><div style="font-size:24px;font-weight:700">${p}% · оценка ${L[1]}</div>
 <div class="lvl" style="color:#6c5ce7">${L[0]}</div><div>${L[2]}</div><div style="margin:12px 0">`+
 SECS.map((S,i)=>`<div class="row"><span class="t">${S.e} ${S.bonus?"Bonus":S.n}</span><span class="b"><i style="width:${100*sc[i]/S.max}%;background:${S.c}"></i></span><span class="n">${sc[i]}/${S.max}</span></div>`).join("")+
 `</div>`+(weak?`<div class="adv">🔁 <b>Что повторить:</b><ul style="margin:4px 0 0;padding-left:20px">${weak}</ul></div>`:`<div class="adv">🎉 Все разделы выполнены уверенно — повторять ничего не нужно!</div>`)+
 `<div style="margin-top:10px;color:var(--mut);font-size:14px">📸 Сделай скриншот этого результата и отправь учителю!</div>`;

 if(p>=56)setTimeout(conf,300);
