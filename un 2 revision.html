<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Повторяем английский!</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--tx:#2b2b2b;--or:#f59a23;--pk:#e6177f;--gr:#2fb344;--rd:#e5484d;--bl:#e3f4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--card:#2a261d;--tx:#f3ede0;--bl:#26343a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;text-align:center}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:1.6rem;margin:6px 0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
nav button,.opt,.go{font:inherit;font-weight:700;border:3px solid var(--or);background:var(--card);color:var(--tx);border-radius:16px;padding:10px 14px;cursor:pointer}
nav button.on{background:var(--or);color:#fff}
#game{background:var(--card);border-radius:22px;padding:16px;min-height:340px}
.rule{background:var(--bl);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:1.05rem}
.prog{color:var(--pk);font-weight:700}
.big{font-size:5.5rem;line-height:1.1;margin:8px 0}.big img,.cell img{max-width:150px;max-height:150px;border-radius:18px}img{border-radius:14px}
.e{font-size:inherit}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts.one{grid-template-columns:1fr}
.opt{font-size:1.2rem;min-height:60px}.opt .e{font-size:2.6rem}.opt img{max-height:90px}
.ok{background:var(--gr)!important;color:#fff!important;border-color:var(--gr)!important}
.bad{background:var(--rd)!important;color:#fff!important;border-color:var(--rd)!important}
.snd{font-size:2rem;border:none;background:none;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:14px;border:3px solid var(--pk);background:var(--pk);color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:2px;font-weight:700;overflow:hidden}
.cell.up{background:var(--card);color:var(--tx);font-size:.95rem}.cell.up .e{font-size:2.2rem}.cell.done{border-color:var(--gr);background:var(--card);color:var(--tx);font-size:.95rem}.cell.done .e{font-size:2.2rem}
.kids{display:flex;gap:10px;justify-content:center}
.kid{flex:1;border:3px dashed #bbb;border-radius:18px;padding:8px}.kid.has{border:3px solid var(--or);background:var(--bl)}
.kid .face{font-size:3rem}.kid .big{font-size:3.5rem;min-height:70px}
.cross{position:relative;display:inline-block}.cross::after{content:"✖";position:absolute;inset:0;color:var(--rd);font-size:5rem;display:flex;align-items:center;justify-content:center}.cross .e,.cross img{opacity:.25}
.stars{font-size:2.4rem;margin:14px 0}

.sl{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}.sl span{width:46px;height:56px;border-bottom:4px solid var(--or);font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tile{font:inherit;font-size:1.8rem;font-weight:700;width:52px;height:56px;border-radius:12px;border:3px solid var(--pk);background:var(--card);color:var(--tx);cursor:pointer}.tile:disabled{opacity:.15}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.inp{font:inherit;font-size:1.6rem;text-align:center;border:3px solid var(--or);border-radius:14px;padding:8px;width:80%;background:var(--card);color:var(--tx)}
.hint{font-size:1.8rem;letter-spacing:4px;margin:6px 0}.go{background:var(--or);color:#fff;margin-top:10px}
</style></head><body><main>
<h1>⭐ Повторяем английский! ⭐</h1>
<nav id="nav"></nav>
<div id="game"></div>
</main>

let currentAudio=null;
const say=t=>{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}const src=SOUNDS[t];if(!src)return;currentAudio=new Audio(src);currentAudio.play().catch(()=>{});};
const g=$("#game");
function fin(s,t,again){g.innerHTML=`<div class="stars">${"⭐".repeat(Math.max(1,Math.round(s/t*5)))}</div><h2>${s} из ${t}!</h2><p>${s/t>.7?"Молодец! 🎉":"Хорошая работа! Попробуй ещё раз 💪"}</p><button class="go" id="again">Играть ещё</button>`;$("#again").onclick=again}
function play(total,build,again){let i=0,s=0;const next=()=>{if(i>=total)return fin(s,total,again);let done=false;build(i,(btn,ok,all)=>{if(done)return;done=true;btn.classList.add(ok?"ok":"bad");if(!ok&&all)all.forEach(b=>b.dataset.c&&b.classList.add("ok"));if(ok)s++;i++;setTimeout(next,ok?800:1500)})};next()}
function head(i,t,rule){return `<div class="prog">${i+1} / ${t}</div><div class="rule">${rule}</div>`}
function opts(list,cls){return `<div class="opts ${cls||""}">`+list.map(o=>`<button class="opt" data-c="${o.c?1:""}">${o.h}</button>`).join("")+`</div>`}
function wire(done){const all=[...g.querySelectorAll(".opt")];all.forEach(b=>b.onclick=()=>done(b,!!b.dataset.c,all))}

const games={
"👀 Что это?":function go(){const L=sh(W);play(L.length,(i,done)=>{const a=L[i];const o=sh([a,...sh(W.filter(x=>x!==a)).slice(0,2)]);
 g.innerHTML=head(i,L.length,"Посмотри на картинку и выбери слово. Нажми 🔊, чтобы послушать.")+`<div class="big">${pic(a)}</div><button class="snd" id="s">🔊</button>`+opts(o.map(x=>({h:x,c:x==a})),"one");
 $("#s").onclick=()=>say(a);wire(done)},go)},
"👂 Слушай":function go(){const L=sh(W);play(L.length,(i,done)=>{const a=L[i];const o=sh([a,...sh(W.filter(x=>x!==a)).slice(0,3)]);
 g.innerHTML=head(i,L.length,"Нажми 🔊 и послушай слово. Выбери правильную картинку.")+`<button class="snd" id="s" style="font-size:4rem">🔊</button>`+opts(o.map(x=>({h:pic(x),c:x==a})));
 $("#s").onclick=()=>say(a);setTimeout(()=>say(a),300);wire(done)},go)},
"🎁 I’ve got…":function go(){const L=sh(W);play(L.length,(i,done)=>{const a=L[i],has=Math.random()<.5;
 g.innerHTML=head(i,L.length,"Есть игрушка или нет? Если есть — «I’ve got». Если зачёркнута — «I haven’t got».")+`<div class="big"><span class="${has?"":"cross"}">${pic(a)}</span></div>`+opts([{h:`I’ve got a ${a}.`,c:has},{h:`I haven’t got a ${a}.`,c:!has}],"one");
 wire(done)},go)},
"🙋 my / your":function go(){const L=sh(W);play(L.length,(i,done)=>{const a=L[i],mine=Math.random()<.5;
 g.innerHTML=head(i,L.length,"Чей предмет? Если у тебя — «my». Если у друга — «your».")+`<div class="kids"><div class="kid ${mine?"has":""}"><div class="face">🧒</div><b>Я</b><div class="big">${mine?pic(a):""}</div></div><div class="kid ${mine?"":"has"}"><div class="face">👧</div><b>Друг</b><div class="big">${mine?"":pic(a)}</div></div></div><h2>This is ____ ${a}.</h2>`+opts([{h:"my",c:mine},{h:"your",c:!mine}]);
 wire(done)},go)},
"➕ too":function go(){const L=sh(["skateboard","scooter","bat","ball","kite","robot","boat","teddy","plane","board game","skipping rope"]);play(L.length,(i,done)=>{const a=L[i];
 g.innerHTML=head(i,L.length,"Друг говорит, что у него есть игрушка. У тебя такая же! Что ты ответишь?")+`<div class="big">👧💬 ${pic(a)}</div><h2>I’ve got a ${a}.</h2>`+opts([{h:`I’ve got a ${a}, too.`,c:1},{h:`I haven’t got a ${a}.`,c:0}],"one");
 wire(done)},go)},

"✍️ Собери слово":function go(){const L=sh(WR);play(L.length,(i,done)=>{const a=L[i];let mist=0,slots=[...a].map(c=>c===' '?{c:' ',fixed:true}:null);const empty=()=>[...a].map(c=>c===' '?{c:' ',fixed:true}:null);const ls=sh([...a].filter(c=>c!==' ').map((c,k)=>({c,k})));
 g.innerHTML=head(i,L.length,"Собери слово из букв. Нажимай на буквы по порядку. Нажми на букву в клеточке, чтобы убрать её.")+`<div class="big">${pic(a)}</div><button class="snd" id="s">🔊</button><div class="sl" id="sl"></div><div class="tiles" id="tl"></div>`;
 $("#s").onclick=()=>say(a);const sl=$("#sl"),tl=$("#tl");
 const draw=()=>{sl.innerHTML="";slots.forEach((t,n)=>{const s=document.createElement("span");s.textContent=t?(t.fixed?'·':t.c):"";if(t?.fixed){s.style.borderBottom='none';s.style.width='16px'}s.onclick=()=>{if(t&&!t.fixed){slots[n]=null;draw()}};sl.appendChild(s)});
  tl.innerHTML="";ls.forEach(t=>{const b=document.createElement("button");b.className="tile";b.textContent=t.c;b.disabled=slots.includes(t);b.onclick=()=>{const n=slots.indexOf(null);slots[n]=t;draw();if(!slots.includes(null))check()};tl.appendChild(b)})};
 const check=()=>{if(slots.map(t=>t.c).join("")==a){sl.classList.add("ok");say(a);done(document.createElement("i"),!mist)}else{mist=1;sl.classList.add("shake");setTimeout(()=>{sl.classList.remove("shake");slots=empty();draw()},500)}};draw()},go)},
"🔤 Вставь буквы":function go(){const L=sh(WR);play(L.length,(i,done)=>{const a=L[i],positions=sh([...a].map((c,k)=>c===' '?-1:k).filter(k=>k>=0)).slice(0,Math.min(4,Math.max(2,Math.ceil(a.replaceAll(' ','').length/3)))).sort((x,y)=>x-y);let mistakes=0;
 g.innerHTML=head(i,L.length,"Вставь пропущенные буквы. В некоторых словах пропущено несколько букв.")+`<div class="big">${pic(a)}</div><button class="snd" id="s">🔊</button><div style="font-size:1.5rem;letter-spacing:3px;line-height:2.3;overflow-wrap:anywhere">${[...a].map((c,k)=>positions.includes(k)?`<input aria-label="Буква ${k+1}" class="missing" data-pos="${k}" maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:34px;text-align:center;font:inherit;border:0;border-bottom:3px solid var(--or);background:var(--bl);color:var(--tx);border-radius:5px">`:c===' '?'&nbsp;':c).join('')}</div><button class="go" id="ck">Проверить ✔</button><div id="msg"></div>`;
 $('#s').onclick=()=>say(a);const fields=[...g.querySelectorAll('.missing')];fields[0].focus();fields.forEach((f,k)=>f.addEventListener('input',()=>{f.value=f.value.toLowerCase();if(f.value&&fields[k+1])fields[k+1].focus()}));
 $('#ck').onclick=()=>{const correct=fields.every(f=>f.value.toLowerCase()===a[+f.dataset.pos]);if(correct){$('#msg').textContent='Правильно! 🎉';say(a);done($('#ck'),mistakes===0)}else{mistakes++;$('#msg').textContent='Попробуй ещё раз!';fields.forEach(f=>{f.style.borderColor=f.value===a[+f.dataset.pos]?'var(--gr)':'var(--rd)'})}};
 },go)},
"⌨️ Напиши сам":function go(){const L=sh(WR);play(L.length,(i,done)=>{const a=L[i];let tries=0;
 g.innerHTML=head(i,L.length,"Посмотри на картинку и напиши слово по-английски.")+`<div class="big">${pic(a)}</div><button class="snd" id="s">🔊</button><div class="hint">${a[0]} ${"_ ".repeat(a.length-1)}</div><input class="inp" id="in" autocomplete="off" autocapitalize="off" spellcheck="false"><br><button class="go" id="ck">Проверить ✔</button><div id="msg" style="margin-top:8px;font-weight:700"></div>`;
 $("#s").onclick=()=>say(a);const inp=$("#in"),msg=$("#msg");
 let copying=false,finished=false;
 const chk=()=>{if(finished)return;const v=inp.value.trim().toLowerCase();if(copying){if(v===a)finishCopy();else msg.textContent="Перепечатай всё слово по буквам 👇";return}if(v===a){finished=true;msg.textContent="Правильно! 🎉";inp.classList.add("ok");say(a);done(document.createElement("i"),true)}else{tries++;copying=true;msg.innerHTML=`Правильно: <strong>${a}</strong><br>Перепечатай слово по буквам, чтобы его запомнить!`;inp.value="";inp.classList.remove("bad");inp.focus();$("#ck").textContent="Проверить слово ✔"}};
 const finishCopy=()=>{if(finished)return;finished=true;msg.textContent="Молодец! Ты перепечатал слово! ⭐";inp.classList.add("ok");say(a);done(document.createElement("i"),false)};
 inp.addEventListener('input',()=>{if(!copying||finished)return;const v=inp.value.toLowerCase();if(!a.startsWith(v)){inp.value=v.slice(0,-1);msg.innerHTML=`Правильно: <strong>${a}</strong><br>Попробуй ещё раз. Печатай по одной букве!`;return}if(v===a)finishCopy()});
 $("#ck").onclick=chk;inp.onkeydown=e=>{if(e.key=="Enter")chk()}},go)},
};
const nav=$("#nav");const order=Object.keys(games);order.unshift(order.splice(order.findIndex(k=>k.includes('Слушай')),1)[0]);order.forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");games[k]()};nav.appendChild(b);if(!i)b.click()});
</script></body></html>
