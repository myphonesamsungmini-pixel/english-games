      const lowpass=audio.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=2800;
      const gain=audio.createGain();
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.linearRampToValueAtTime(.043,t+.045);
      gain.gain.linearRampToValueAtTime(.027,t+.14);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      src.connect(highpass);highpass.connect(lowpass);lowpass.connect(gain);gain.connect(audio.destination);
      src.start(t);src.stop(t+duration);
    }else{
      // Звуки ошибки и нажатия оставлены без изменений.
      const notes=kind==='no'?[310,245]:[530];
      notes.forEach((hz,i)=>{
        const o=audio.createOscillator(),g=audio.createGain();
        o.type=kind==='no'?'triangle':'sine';
        o.frequency.setValueAtTime(hz,t+i*.09);
        g.gain.setValueAtTime(.0001,t+i*.09);
        g.gain.exponentialRampToValueAtTime(.09,t+i*.09+.012);
        g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.13);
        o.connect(g);g.connect(audio.destination);
        o.start(t+i*.09);o.stop(t+i*.09+.15);
      });
    }
  }catch(e){}
}
function ensureSound(){if(soundOn)tone('tap')}
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊 Звук вкл.':'🔇 Звук выкл.';if(soundOn)tone('tap')};
function prepare(){attempt=[];feedback='';feedbackType='';checked=false;reveal=false;typedValue='';finished=false;const l=letters();if(stage===2||stage===3){let count=stage===2?Math.min(2,l.length-1):Math.min(4,l.length-1);missing=shuffle(l.map((_,i)=>i)).slice(0,count).sort((a,b)=>a-b);bank=shuffle(missing.map(i=>l[i]).concat(stage===3?shuffle('aeioprst'.split('')).slice(0,2):[])).map((c,i)=>({c,id:i}));}else if(stage===1||stage===4){missing=l.map((_,i)=>i);bank=shuffle(l).map((c,i)=>({c,id:i}));}else if(stage===5){anagram=shuffle(l).join('').replace(/(.{1})/g,'$1 ').trim();if(anagram.replace(/\s/g,'')===l.join(''))anagram=l.slice(1).concat(l[0]).join(' ').trim();}else if(stage===0){const picks=shuffle(WORDS.filter(x=>x.word!==word())).slice(0,3).map(x=>x.word);choiceItems=shuffle([word(),...picks]);}}
function status(t,kind){feedback=t;feedbackType=kind;const el=$('#feedback');if(el){el.textContent=t;el.className='feedback '+kind;}}
function success(){if(checked)return;checked=true;earned.add(key());status('✨ Отлично! Правильно!','success');tone('yes');renderNav();updateHeader();showActionButtons();document.querySelectorAll('.tile.filled').forEach(el=>el.classList.add('correct'))}
function wrong(){status('💫 Пока не получилось. Попробуй ещё!','fail');tone('no')}
function updateHeader(){$('#stars').textContent=earned.size;$('#progressCount').textContent=(index+1)+' / 8';$('#progressLabel').textContent='Раунд '+(stage+1)+' · '+ROUNDS[stage][0];$('#progressBar').style.width=((index+(checked?1:0))/8*100)+'%';}
function renderNav(){let nav=$('#stages');nav.innerHTML='';ROUNDS.forEach((r,i)=>{let b=document.createElement('button');b.className='stageBtn'+(stage===i?' active':'')+(completed.has(i)?' done':'');b.innerHTML='<strong>'+r[2]+' '+(i+1)+'</strong>'+r[0];b.onclick=()=>{tone('tap');stage=i;index=0;prepare();render();};nav.append(b)})}
function makeTiles(){let l=[...word()],p=0;return l.map(c=>{if(c===' ')return '<span class="tile space" aria-hidden="true"></span>';let isMissing=missing.includes(p);let pos=missing.indexOf(p);let entered=isMissing?attempt[pos]:null;p++;if(!isMissing)return '<span class="tile fixed">'+c+'</span>';return '<span class="tile '+(entered?'filled':'empty')+'">'+(entered?entered.c:'_')+'</span>'}).join('')}
function availableBank(){let used=new Set(attempt.map(x=>x.id));return '<div class="letterBank">'+bank.map(it=>'<button class="letter" '+(used.has(it.id)||checked?'disabled':'')+' onclick="pick('+it.id+')">'+it.c+'</button>').join('')+'</div>'}
function render(){renderNav();updateHeader();const r=ROUNDS[stage],w=WORDS[index];let html='<div class="gameTop"><div><div class="eyebrow">'+r[2]+' SPELLING ADVENTURE</div><h2>'+r[0]+'</h2><p class="instruction">'+r[1]+'</p></div><div class="countBadge">Toy '+(index+1)+' / 8</div></div><div class="mainGrid"><div class="picture"><img src="'+w.image+'" alt="Игрушка — угадай слово"></div><section class="practice" id="practice"></section></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="footerControls"><span class="tip">💡 Ошибся? Можно попробовать ещё раз!</span><span id="foot"> </span></div>';
$('#game').innerHTML=html;const p=$('#practice');if(stage===0){p.innerHTML='<div class="sectionLabel">Какое слово подходит к картинке?</div><div class="choiceGrid">'+choiceItems.map((ch,i)=>'<button class="choice" data-choice="'+i+'" onclick="choose('+i+')">'+ch+'</button>').join('')+'</div>';}else if(stage===1){p.innerHTML='<div class="sectionLabel">Внимательно посмотри и собери слово!</div><div class="modelWord">'+w.word+'</div><div class="targetBoxes" id="targets">'+makeTiles()+'</div>'+availableBank();}else if(stage===2||stage===3){p.innerHTML='<div class="sectionLabel">Нажимай на пропущенные буквы по порядку</div><div class="targetBoxes" id="targets">'+makeTiles()+'</div>'+availableBank();}else if(stage===4){p.innerHTML='<div class="sectionLabel">Собери слово из перепутанных букв!</div><div class="targetBoxes" id="targets">'+makeTiles()+'</div>'+availableBank();}else{p.innerHTML='<div class="sectionLabel">'+(stage===5?'Разгадай буквы и напиши слово!':'Сможешь написать слово без подсказки?')+'</div>'+(stage===5?'<div class="anagram" aria-label="Перепутанные буквы">'+anagram+'</div>':'')+'<input class="typed" id="typing" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="Напиши слово здесь" aria-label="Напиши слово"><div class="typedNote">Не забудь пробел между двумя словами.</div>';let input=$('#typing');input.value=typedValue;input.disabled=checked;input.addEventListener('input',e=>typedValue=e.target.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkTyped();}});}
status(feedback,feedbackType);showActionButtons();}
function showActionButtons(){let f=$('#foot');if(!f)return;let actions=[];if(stage>=5&&!checked)actions.push('<button class="secondary" onclick="hint()">💡 Подсказка</button>','<button class="primary" onclick="checkTyped()">Проверить ✓</button>');else if(stage!==0&&!checked)actions.push('<button class="secondary" onclick="undo()">↶ Убрать букву</button>','<button class="secondary" onclick="hint()">💡 Подсказка</button>');if(checked)actions.push('<button class="primary" onclick="next()">Дальше →</button>');else actions.push('<button class="secondary" onclick="next()">Пропустить →</button>');f.innerHTML='<div class="actionArea">'+actions.join('')+'</div>'}
function choose(i){if(checked)return;const answer=choiceItems[i];if(answer===word()){let b=document.querySelectorAll('.choice')[i];b.classList.add('good');success();}else{let b=document.querySelectorAll('.choice')[i];b.classList.add('bad');wrong();setTimeout(()=>b?.classList.remove('bad'),650);}}
function pick(id){if(checked)return;let item=bank.find(x=>x.id===id);if(!item||attempt.some(x=>x.id===id)||attempt.length>=missing.length)return;let expected=letters()[missing[attempt.length]];if(item.c!==expected){wrong();return;}attempt.push(item);tone('tap');status('','');if(attempt.length===missing.length){render();success();}else{render();}}
function undo(){if(checked)return;if(stage>=5){typedValue='';$('#typing').value='';}else attempt.pop();tone('tap');status('','');if(stage<5)render();}
function hint(){if(checked)return;let w=word();if(stage>=5){let l=[...w].find(c=>c!==' ');status('💡 Первая буква: '+l.toUpperCase()+' · всего букв: '+letters().length,'');}else{let expected=letters()[missing[attempt.length]];status('💡 Следующая буква: '+(expected||'').toUpperCase(),'');}tone('tap')}
function checkTyped(){if(checked)return;let input=$('#typing');if(input)typedValue=input.value;let answer=typedValue.toLowerCase().trim().replace(/\s+/g,' ');if(answer===word()){success();if(input)input.disabled=true;}else if(!answer)status('⌨️ Сначала напиши слово!','fail');else wrong();}
function next(){tone('tap');if(index<7){index++;prepare();render();return;}completed.add(stage);if(stage<6){stage++;index=0;prepare();render();}else{renderComplete();}}
function renderComplete(){renderNav();$('#progressBar').style.width='100%';$('#progressCount').textContent='8 / 8';$('#game').innerHTML='<div class="complete"><div class="star">🏆</div><h2>Ты звезда правописания!</h2><div class="miniStars">🌟 ⭐ 🌟</div><p>Все семь раундов пройдены! У тебя '+earned.size+' звёздочек из 56.</p><p>Хочешь поиграть ещё раз?</p><button class="primary" onclick="restart()">🔁 Играть снова</button></div>';}
function restart(){earned.clear();completed.clear();stage=0;index=0;prepare();render();tone('tap')}
prepare();render();
</script></body></html>
