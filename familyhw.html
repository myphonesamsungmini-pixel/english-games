function renderExtra(){let k=sec===4?2:0,i=extraPos[k],arr=extra[k],t=arr[i];if(!t){app.innerHTML=`<div class="card"><h2>Section complete!</h2><button class="go" id="repeat">Try again</button></div>`;document.querySelector('#repeat').onclick=()=>{extraPos[k]=0;Object.keys(extraState).filter(x=>x.startsWith(k+':')).forEach(x=>delete extraState[x]);render()};return;}let key=k+':'+i,st=extraState[key]||(extraState[key]={v:[],opts:k===1?shuffle(t.slice(1)):[]}),answers=t[1].split(';');let n=0;let prompt=esc(t[0]).replace(/___/g,()=>`<span class="gap">${++n}</span>`);app.innerHTML=`<div class="meta">Task ${i+1} / ${arr.length}</div><div class="bar"><i style="width:${(i+1)/arr.length*100}%"></i></div><div class="card"><h2>${names[sec]}</h2><p class="hint">${['Fill in the gaps using the word bank. Mind the grammar!<br>Заполни пропуски словами из списка. Учитывай грамматику! Нажми на слово, чтобы вставить его в поле ответа, и при необходимости измени форму.','Choose the correct option.','Translate the Russian phrases into English.<br>Переведи русские фразы на английский.'][k]}</p>${k===0?'<div class="row">'+['support','trust','talk','spend time','look after','approve of','share','get on well','gather','argue'].map(w=>`<button class="chip" data-word="${w}" ${st.checked?'disabled':''}>${w}</button>`).join('')+'</div>':''}<p class="q">${prompt}</p>${k===1?st.opts.map(o=>`<button class="opt ${st.checked?(o===t[1]?'ok':o===st.v[0]?'bad':''):''}" data-choice="${esc(o)}" ${st.checked?'disabled':''}>${esc(o)}</button>`).join(''):answers.map((a,j)=>`<input type="text" style="margin-bottom:8px" data-entry="${j}" placeholder="Answer / Ответ ${j+1}" value="${esc(st.v[j]||'')}" ${st.checked?'disabled':''}>`).join('')+`<button class="go" id="checkExtra" ${st.checked?'disabled':''}>Check</button>`}<div id="fb"></div><button class="go alt" style="margin-top:8px" id="showExtra">${st.show?'Скрыть ответ':'Показать ответ'}</button>${st.show?`<div class="answer">${esc(answers.join(' · '))}</div>`:''}</div><div class="nav"><button class="go alt" id="prevExtra" ${i===0?'disabled':''}>Back</button><button class="go" id="nextExtra">${i===arr.length-1?'Finish':'Next'}</button></div>`;app.querySelectorAll('[data-entry]').forEach(e=>e.oninput=()=>st.v[+e.dataset.entry]=e.value);app.querySelectorAll('[data-word]').forEach(e=>e.onclick=()=>{if(st.checked)return;let input=app.querySelector('[data-entry="0"]');input.value=e.dataset.word;st.v[0]=input.value;app.querySelectorAll('[data-word]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));input.focus();});app.querySelectorAll('[data-choice]').forEach(e=>e.onclick=()=>{st.v=[e.dataset.choice];st.checked=true;render()});let check=document.querySelector('#checkExtra');if(check)check.onclick=()=>{if(answers.some((_,j)=>!norm(st.v[j]||'')))return;st.checked=true;render()};document.querySelector('#showExtra').onclick=()=>{st.show=!st.show;render()};document.querySelector('#prevExtra').onclick=()=>{extraPos[k]--;render()};document.querySelector('#nextExtra').onclick=()=>{extraPos[k]++;render()};if(st.checked){let ok=answers.every((a,j)=>a.split(' / ').some(v=>norm(v)===norm(st.v[j]||'')));feedback(ok?'Correct!':'Correct answer: '+answers.join(' · '),ok)}}
function feedback(msg,ok){document.querySelector('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${esc(msg)}</div>`}reset();
</script></body></html>
