dius:20px;background:#f0fbfc;min-height:190px;margin:15px 0 22px;flex-direction:column;padding:18px;text-align:center}.emoji{font-size:clamp(68px,10vw,110px);line-height:1.3}.word{font-size:clamp(30px,5vw,46px);font-weight:900;color:#084d65}.tiny{font-size:14px;color:#66808b}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice,.action{border:2px solid var(--line);background:white;border-radius:15px;padding:16px;font-size:18px;font-weight:800;color:var(--dark);transition:transform .12s,background .12s}.choice:hover:not(:disabled),.action:hover:not(:disabled){transform:translateY(-2px);background:#eefbfc}.choice:disabled{cursor:default}.choice.correct{background:#cbf8e5;border-color:#33b886}.choice.wrong{background:#ffe2e8;border-color:#e87992}.feedback{min-height:32px;margin:14px 0;font-weight:800}.good{color:#008561}.bad{color:#c43d62}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.primary{background:var(--teal);color:white;border:2px solid var(--teal);border-radius:13px;padding:13px 23px;font-weight:900}.primary:hover{background:#007f91}.secondary{background:white;color:#176177;border:2px solid #b7e0e4;border-radius:13px;padding:12px 18px;font-weight:800}.flash{min-height:260px;background:linear-gradient(145deg,#dff8f9,#f9ecf6);border:3px solid #a8dfe5;border-radius:23px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;cursor:pointer;user-select:none;padding:24px}.flash .emoji{font-size:86px}.pill{display:inline-block;background:#fff1b8;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:800}.typing{width:100%;max-width:440px;padding:16px;font:800 22px ui-rounded,system-ui;border:2px solid #9ed6dc;border-radius:15px;outline:0}.typing:focus{border-color:var(--teal)}.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.vocab-item{border:2px solid #d8ecef;border-radius:16px;padding:14px;text-ali .tile:disabled{opacity:.3;cursor:default}.tile.chosen{border-color:#29aebc;background:#dcf8f9}.sentence-placeholder{color:#66828d;font-weight:800}.fixed-period{font-size:28px;font-weight:900;color:#15455b;padding:0 5px;align-self:center}
.scene-help{font-size:14px;color:#526f81;text-align:center}.sentence-feedback{text-align:center;min-height:28px;font-size:18px;font-weight:800}

const items=[['boots','🥾','Footwear that covers your ankles.'],['cap','🧢','A soft hat with a peak.'],['coat','🧥','A warm outer layer, often long.'],['dress','👗','One-piece clothing with a skirt.'],['hoodie','👚','A top with a hood.'],['jacket','🧥','A shorter outer layer.'],['jeans','👖','Trousers made of denim.'],['jumper','🧶','A warm knitted top (British English).'],['shirt','👔','A top often with a collar and buttons.'],['shoes','👞','Footwear for your feet.'],['skirt','👗','Clothing that hangs from the waist.'],['T-shirt','👕','A casual, short-sleeved top.'],['top','🎽','Clothing worn on the upper body.'],['tracksuit','🏃','Matching sports jacket/top and trousers.'],['trainers','👟','Comfortable sports shoes (British English).'],['trousers','👖','Clothing covering both legs separately.']].map(([word,emoji,hint])=>({word,emoji,hint}));
const $=s=>document.querySelector(s),panel=$('#panel');let score=Number(localStorage.getItem('clothesScore'))||0,streak=0,misses=JSON.parse(localStorage.getItem('clothesMisses')||'{}'),mode='cards',index=0,deck=[],flipped=false,answered=false,selected=null,matches=0,round=[];const shuffle=a=>[...a].sort(()=>Math.random()-.5);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const save=()=>{localStorage.setItem('clothesScore',score);localStorage.setItem('clothesMisses',JSON.stringify(misses));$('#score').textContent=score;$('#streak').textContent=streak};function speak(word){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function award(n){score+=n;streak++;save()}function mistake(word){misses[word]=(misses[word]||0)+1;streak=0;save()}function learned(word){if(misses[word]){misses[word]--;if(!misses[word])delete misses[word]}save()}function h(title,detail=''){return `<div class="topline"><span class="eyebrow">${title}</span><span class="tiny">${detail}</span></div>`}function bar(){return `<div class="progress" role="progressbar" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${deck.length}"><div class="fill" style="width:${100*index/deck.length}%"></div></div>`}function end(title){panel.innerHTML=`<div class="summary"><div class="stars">🌟 🎉 🌟</div><h2>${title}</h2><p>Great practice! Every round helps you remember more words.</p><p class="muted">Your points: <strong>${score}</strong> · Words to practise again: <strong>${Object.keys(misses).length}</strong></p><div class="actions"><button class="primary" id="again">Play again ↻</button><button class="secondary" id="reviewNext">Practise tricky words</button></div></div>`;$('#again').onclick=()=>start(mode);$('#reviewNext').onclick=()=>start('review')}
function start(m){mode=m;index=0;answered=false;flipped=false;selected=null;matches=0;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));deck=shuffle(mode==='sentences'?sentenceQuestions:mode==='review'?items.filter(x=>misses[x.word]):items);if(mode==='review'&&!deck.length){panel.innerHTML=h('My practice')+'<div class="summary"><div class="emoji">🏆</div><h2>No tricky words yet!</h2><p>Try the Picture Quiz or Listen & Choose. Words you miss will appear here for extra practice.</p><button class="primary" onclick="start(\'quiz\')">Start a quiz</button></div>';return}render()}

function card(){const it=deck[index];panel.innerHTML=h('Flashcards',`Card ${index+1} of ${deck.length}`)+bar()+`<h2>Look, think, and flip!</h2><p class="muted instructions">Say the word out loud before you reveal it. Tap the card to flip.</p><div class="flash" id="flip" tabindex="0" role="button" aria-label="Flip flashcard"><span class="pill">${flipped?'Answer':'Picture clue'}</span>${pic(it,"large")}${flipped?`<span class="word">${esc(it.word)}</span><span>${esc(it.hint)}</span>`:'<span class="tiny">Tap to reveal the word</span>'}</div><div class="actions"><button class="secondary" id="listen">🔊 Hear word</button>${flipped?'<button class="secondary" id="hard">🔁 Practise again</button><button class="primary" id="got">✅ I remembered!</button>':'<button class="primary" id="reveal">Reveal answer</button>'}</div>`;const flip=()=>{flipped=!flipped;card()};$('#flip').onclick=flip;$('#flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('#listen').onclick=()=>speak(it.word);if(flipped){$('#hard').onclick=()=>{mistake(it.word);index++;flipped=false;render()};$('#got').onclick=()=>{award(5);learned(it.word);index++;flipped=false;render()}}else $('#reveal').onclick=flip}
function opts(it){return shuffle([it,...shuffle(items.filter(x=>x.word!==it.word)).slice(0,3)])}function quiz(){const it=deck[index],options=opts(it);panel.innerHTML=h(mode==='review'?'Tricky word training':'Picture quiz',`Question ${index+1} of ${deck.length}`)+bar()+`<h2>Which word matches the clue?</h2><div class="hero">${pic(it,"large")}<span class="tiny">${esc(it.hint)}</span></div><div class="choices">${options.map(o=>`<button class="choice" data-answer="${esc(o.word)}">${esc(o.word)}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="assertive"></div><div class="actions"><button class="primary hidden" id="next">Next →</button></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.dataset.answer===it.word;document.querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(c.dataset.answer===it.word)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});if(ok){award(10);learned(it.word)}else mistake(it.word);$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✅ Correct! Excellent!':`Not quite. The answer is ${it.word}.`;$('#next').classList.remove('hidden')});answered=false;$('#next').onclick=()=>{index++;answered=false;render()}}

function renderMatch(fresh=false){if(fresh){round=shuffle(items).slice(0,5);selected=null;matches=0}const right=shuffle(round);panel.innerHTML=h('Match pairs','5 pairs per round')+`<h2>Match pictures with clothing words</h2><p class="muted">Select a picture, then its word. Use the clues if pictures look similar.</p><div class="match-layout"><div class="match-col">${round.map((it,i)=>`<button class="match" data-side="pic" data-word="${esc(it.word)}" title="${esc(it.hint)}">${pic(it,"small")}</button>`).join('')}</div><div class="match-col">${right.map(it=>`<button class="match" data-side="word" data-word="${esc(it.word)}">${esc(it.word)}</button>`).join('')}</div></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="secondary" id="restartMatch">New five words ↻</button><button class="primary hidden" id="nextMatch">Play another set →</button></div>`;document.querySelectorAll('.match').forEach(b=>b.onclick=()=>{if(b.classList.contains('solved'))return;if(!selected){selected=b;b.classList.add('selected');return}if(selected===b){b.classList.remove('selected');selected=null;return}if(selected.dataset.side===b.dataset.side){selected.classList.remove('selected');selected=b;b.classList.add('selected');return}const old=selected;selected=null;old.classList.remove('selected');if(old.dataset.word===b.dataset.word){old.classList.add('solved');b.classList.add('solved');old.disabled=true;b.disabled=true;matches++;award(10);learned(b.dataset.word);$('#feedback').textContent='✅ Nice match!';$('#feedback').className='feedback good';if(matches===5){$('#feedback').textContent='🎉 You matched all 5 pairs!';$('#nextMatch').classList.remove('hidden')}}else{mistake(old.dataset.side==='word'?old.dataset.word:b.dataset.word);$('#feedback').textContent='Try another pair!';$('#feedback').className='feedback bad'}});$('#restartMatch').onclick=()=>renderMatch(true);$('#nextMatch').onclick=()=>renderMatch(true)}
function words(){panel.innerHTML=h('Word bank','All 16 words')+`<h2>Study all the clothes words</h2><p class="muted">Tap 🔊 to hear British English pronunciation. Look at each illustration and listen to the pronunciation.</p><div class="vocab-grid">${items.map(x=>`<div class="vocab-item"><div class="word-image">${pic(x,"bank")}</div><strong>${esc(x.word)}</strong><div class="tiny">${esc(x.hint)}</div><button data-say="${esc(x.word)}">🔊 Listen</button></div>`).join('')}</div>`;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say))}

const sentenceQuestions = [
 {g:0,c:0,cl:'T-shirt',color:'green',noun:'hoodie',plural:false},
 {g:0,c:0,noun:'cap',color:'blue'},
 {g:0,c:0,noun:'jeans',color:'blue',plural:true},
 {g:0,c:0,noun:'boots',color:'brown',plural:true},

 {g:0,c:3,noun:'trainers',color:'pink',plural:true},

 {g:0,c:5,noun:'skirt',color:'blue'},

 {g:1,c:1,noun:'skirt',color:'blue'},

 {g:1,c:3,noun:'jeans',color:'blue',plural:true},

 {g:1,c:4,noun:'boots',color:'brown',plural:true},
 {g:1,c:5,noun:'coat',color:'blue'},
 {g:1,c:5,noun:'dress',color:'pink'}
];
let sentencePicked=[], sentenceTiles=[], sentenceDone=false;
function sentenceGame(){
 if(index>=deck.length){end('Sentence challenge complete!');return}
 const q=deck[index],verb=q.plural?'are':'is';
 const answer=['The',q.noun,verb,q.color];
 sentencePicked=[];sentenceDone=false;
 // Include the wrong verb so learners must choose between is and are.
 sentenceTiles=shuffle([...answer,verb==='is'?'are':'is']).map((word,id)=>({word,id}));
 panel.innerHTML=h('Make a Sentence',`Sentence ${index+1} of ${deck.length}`)+bar()+
 `<h2>Describe the clothes!</h2><p class="muted">Look at child <strong>${q.c+1}</strong> (highlighted in yellow). Put the words in the correct order. Remember: <strong>is</strong> or <strong>are</strong>?</p>`+
 `<div class="scene-wrap"><img alt="Six children wearing different coloured clothes" src="${groupScenes[q.g]}"><div class="scene-highlight" style="left:${q.c*100/6}%"></div><div class="scene-number">Child ${q.c+1}</div></div>`+
 `<div class="scene-help">Describe the <strong>${esc(q.noun)}</strong> in the picture.</div>`+
 `<div id="sentenceTarget" class="sentence-target" aria-label="Your sentence"></div><div id="tileBank" class="word-tiles"></div>`+
 `<div id="sentenceFeedback" class="sentence-feedback" aria-live="polite"></div>`+
 `<div class="actions"><button class="secondary" id="sentenceUndo">↶ Undo</button><button class="secondary" id="sentenceReset">Reset</button><button class="primary" id="sentenceCheck">Check sentence ✓</button><button class="primary hidden" id="sentenceNext">Next →</button></div>`;
 function paint(){
  $('#sentenceTarget').innerHTML=sentencePicked.length?sentencePicked.map((t,i)=>`<button class="tile chosen" data-picked="${i}" aria-label="Remove ${esc(t.word)}">${esc(t.word)}</button>`).join(''):'<span class="sentence-placeholder">Tap words below to build a sentence</span>';
  $('#sentenceTarget').insertAdjacentHTML('beforeend', '<span class="fixed-period" aria-label="Full stop">.</span>');
  $('#tileBank').innerHTML=sentenceTiles.map(t=>`<button class="tile" data-id="${t.id}" ${sentencePicked.some(p=>p.id===t.id)?'disabled':''}>${esc(t.word)}</button>`).join('');
  document.querySelectorAll('#tileBank .tile').forEach(b=>b.onclick=()=>{if(sentenceDone)return;sentencePicked.push(sentenceTiles.find(x=>x.id===Number(b.dataset.id)));paint()});
  document.querySelectorAll('#sentenceTarget .tile').forEach(b=>b.onclick=()=>{if(sentenceDone)return;sentencePicked.splice(Number(b.dataset.picked),1);paint()});
 }
 paint();
 $('#sentenceUndo').onclick=()=>{if(!sentenceDone){sentencePicked.pop();paint()}};
 $('#sentenceReset').onclick=()=>{if(!sentenceDone){sentencePicked=[];paint()}};
 $('#sentenceCheck').onclick=()=>{
  if(sentenceDone)return;
  const got=sentencePicked.map(t=>t.word).join(' '),expected=answer.join(' ');
  if(got===expected){sentenceDone=true;award(15);$('#sentenceFeedback').textContent='✅ Great sentence! '+answer.join(' ')+'.';$('#sentenceFeedback').className='sentence-feedback good';$('#sentenceCheck').classList.add('hidden');$('#sentenceNext').classList.remove('hidden');$('#sentenceUndo').disabled=true;$('#sentenceReset').disabled=true;speak(answer.join(' ') + '.');}
  else{$('#sentenceFeedback').textContent=sentencePicked.length<4?'Add all the words to complete your sentence.':'Not quite! Check word order and is / are.';$('#sentenceFeedback').className='sentence-feedback bad';}
 };
 $('#sentenceNext').onclick=()=>{index++;sentenceGame()};
}

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));save();start('cards');
</script></body></html>
