<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping: подготовка к тесту</title>
<style>
:root{--bg:#f3f8fa;--card:#fff;--ink:#16303a;--mut:#5b7480;--line:#cfe0e6;--pri:#0f9db8;--pri2:#e8f6f9;--acc:#f07a1e;--ok:#1b8a4b;--okb:#e5f6ec;--bad:#c4372c;--badb:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c21;--card:#17282f;--ink:#e6f1f4;--mut:#93aab3;--line:#2a4550;--pri:#35c1db;--pri2:#16343c;--acc:#ff9a4d;--ok:#4cd08a;--okb:#143525;--bad:#ff7d72;--badb:#3b1d1b}}
:root[data-theme="dark"]{--bg:#0f1c21;--card:#17282f;--ink:#e6f1f4;--mut:#93aab3;--line:#2a4550;--pri:#35c1db;--pri2:#16343c;--acc:#ff9a4d;--ok:#4cd08a;--okb:#143525;--bad:#ff7d72;--badb:#3b1d1b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Nunito","Trebuchet MS",Verdana,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
header{background:var(--acc);color:#fff;border-radius:18px;padding:22px 22px 18px;margin-bottom:16px}
header h1{margin:0;font-size:34px;line-height:1.1;color:#fff}header p{margin:6px 0 0;color:#fff}
header input{margin-top:12px;padding:9px 12px;border-radius:10px;border:0;font:inherit;width:min(100%,320px);color:#16303a}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:22px;color:var(--pri)}
.note{color:var(--mut);margin:0 0 12px;font-size:15px}
.tip{background:var(--pri2);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--pri);color:#fff;text-align:left;padding:7px 10px}td{border-bottom:1px solid var(--line);padding:7px 10px}
td b,.hl{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.it{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.it img{width:100%;border-radius:8px;max-height:170px;object-fit:cover}
.it .e{font-size:54px;text-align:center}.it p{margin:0;font-size:16px}
.it select,.it input{font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.it.ok{border-color:var(--ok);background:var(--okb)}.it.bad{border-color:var(--bad);background:var(--badb)}
.fb{font-weight:700;font-size:14px;min-height:0}.ok .fb{color:var(--ok)}.bad .fb{color:var(--bad)}
.go{display:block;margin:6px auto 0;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px 28px;font:inherit;font-weight:800;font-size:19px;cursor:pointer}
.go:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.sec{background:transparent;border:0;padding:0;color:var(--pri);background:none;font:inherit;cursor:pointer;text-decoration:underline;margin:8px auto;display:block}
#res{display:none}
.card{border:3px solid var(--pri);border-radius:18px;padding:18px;background:var(--card)}
.big{font-size:54px;font-weight:800;color:var(--acc);line-height:1}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--pri)}
.rv{border-left:4px solid var(--bad);background:var(--badb);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.rv .a{color:var(--ok);font-weight:800}.rv .y{color:var(--bad);text-decoration:line-through}

#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding:8px 0;margin-bottom:10px}
#tabs button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
#tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:800}
.pane{display:none}
.fc{width:100%;min-height:320px;border:3px solid var(--pri);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:pointer;text-align:center}
.fc.back{background:var(--pri2)}.fc img{width:min(100%,340px);border-radius:10px}.fc .e{font-size:90px}
.fc .w1{font-size:30px;font-weight:800;color:var(--pri)}.fc .h{font-size:14px;color:var(--mut)}.fc .ex{font-size:19px;font-style:italic}
.fcn{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.btn{background:var(--pri2);color:var(--ink);border:2px solid var(--pri);border-radius:12px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
.zone{min-height:46px;width:100%;border:2px dashed var(--pri);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font:inherit;color:var(--ink);padding:3px;cursor:pointer}
.zone:empty::before{content:attr(data-ph);color:var(--mut);font-size:14px}.zone:disabled{color:var(--ink);opacity:1;border-style:solid}
.chip{display:inline-block;background:var(--pri2);border:2px solid var(--pri);border-radius:18px;padding:6px 12px;margin:4px;cursor:grab;font-size:16px;line-height:1.3;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.chip.pick{background:var(--acc);border-color:var(--acc);color:#fff}.chip.lift{opacity:.35}
.chip.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;background:var(--pri2);border:1px dashed var(--pri);border-radius:12px;padding:4px;min-height:46px}
.bank.st{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.check-one{font-size:14px;padding:7px 10px;margin-top:auto}
.it textarea{font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;resize:vertical}

/* Shopping Studio — visual layer only */
:root,:root[data-theme="dark"]{color-scheme:light;--bg:#f4f3f8;--card:#fff;--ink:#242338;--mut:#646478;--line:#e4e0ed;--pri:#6245ba;--pri2:#f0ecfc;--acc:#704bd0;--ok:#14734d;--okb:#edf9f2;--bad:#b33956;--badb:#fff0f3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;--bg:#f4f3f8;--card:#fff;--ink:#242338;--mut:#646478;--line:#e4e0ed;--pri:#6245ba;--pri2:#f0ecfc;--acc:#704bd0;--ok:#14734d;--okb:#edf9f2;--bad:#b33956;--badb:#fff0f3}}
body{font:16px/1.65 'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 10% 0%,#e8defc 0,transparent 42%),radial-gradient(ellipse at 100% 20%,#fce4dd 0,transparent 32%),#f4f3f8;min-height:100vh;background-attachment:fixed}
.w{max-width:1120px;padding:26px 26px 70px}
header{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#242039 0%,#493577 62%,#7755b9 100%);border-radius:30px;padding:36px 40px;box-shadow:0 20px 50px #39276c29;margin-bottom:20px}
header:before{content:'ENGLISH / PRACTICE STUDIO';display:block;letter-spacing:.22em;font-size:10px;font-weight:800;color:#e5d8ff;margin-bottom:14px}
header:after{content:'';position:absolute;z-index:-1;width:310px;height:310px;border:1px solid #ffffff36;border-radius:50%;right:-65px;top:-120px;box-shadow:0 0 0 36px #ffffff0b,0 0 0 72px #ffffff09,0 0 0 108px #ffffff08}
header h1{font-size:clamp(42px,7vw,72px);letter-spacing:-.065em;font-weight:800;line-height:1.04}header p{max-width:720px;color:#f1eafd;font-size:15px;margin-top:16px}header input{background:#ffffff18;color:white;border:1px solid #ffffff4d;border-radius:12px;padding:12px 16px;margin-top:22px}header input::placeholder{color:#e5d8f6}
#tabs{padding:10px 8px;gap:7px;background:#f4f3f8f2;backdrop-filter:blur(16px);border:1px solid #e4e0ed;border-radius:18px;box-shadow:0 5px 22px #2c20400b;scrollbar-width:thin;scrollbar-color:#bca9e6 transparent;margin-bottom:20px}
#tabs button{border:1px solid #e4e0ed;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:650}#tabs button.on{background:#352750;color:white;border-color:#352750;box-shadow:0 4px 10px #35275030}
section{padding:28px;border:1px solid #e5e1ed;border-radius:26px;box-shadow:0 10px 36px #32254e0c;margin-bottom:18px}h2{font-size:clamp(21px,3vw,29px);letter-spacing:-.035em;color:#352750;line-height:1.25;margin-bottom:9px}.note{font-size:14px;margin-bottom:20px}.tip{border:0;border-left:3px solid #a68ae6;border-radius:12px;padding:14px 18px;background:#f4f0fd;margin:16px 0;color:#49405d}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:16px}.it{padding:16px;border:1px solid #e3deed;border-radius:19px;background:#fcfbfe;gap:12px;box-shadow:0 3px 12px #29203806;transition:background .2s,border-color .2s,box-shadow .2s}.it img{height:185px;max-height:none;object-fit:contain;background:#f1edf6;border-radius:12px}.it p{font-size:16px;font-weight:600;line-height:1.5}.it .e{background:#f1edf8;border-radius:13px;padding:12px}.it input,.it select,.it textarea{border:1px solid #dcd5e8;border-radius:11px;padding:11px 12px;background:white}.it.ok{border-color:#78bc9d;box-shadow:0 0 0 2px #ccebdc}.it.bad{border-color:#e4a0b0;box-shadow:0 0 0 2px #f7dce3}.fb:empty{display:none}
button{transition:background .18s,box-shadow .18s,transform .18s}button:focus-visible,.chip:focus-visible{outline:3px solid #a68ae6;outline-offset:3px}button:active:not(:disabled){transform:scale(.985)}.go{background:linear-gradient(110deg,#5d3fb0,#8561d5);border-radius:14px;padding:14px 26px;font-size:16px;box-shadow:0 7px 18px #6844bc35;margin:20px auto 0}.btn{border:1px solid #d8cbed;background:#eee8fa;color:#4e358d;border-radius:11px;font-size:14px;padding:10px 18px}.check-one{margin-top:auto;min-height:40px}.sec{font-weight:650;text-decoration:none;padding:10px 18px;border-radius:10px;background:#eae4f6;margin:12px auto}.zone{border:1.5px dashed #b6a3d8;border-radius:12px;background:#f6f2fd;min-height:54px}.zone:disabled{background:transparent;border-color:#78bc9d}.chip{background:white;border:1px solid #d8cbed;border-radius:9px;padding:8px 11px;font-size:14px;font-weight:600;box-shadow:0 2px 3px #39275c0d}.chip.pick{background:#6845ba;border-color:#6845ba}.bank{background:#eee9f7;border:1px solid #e0d6ee;padding:8px;border-radius:14px}.bank.st{top:calc(env(safe-area-inset-top,0px) + 72px);box-shadow:0 5px 14px #35275014}
.fc{min-height:400px;border:1px solid #e4daef;border-radius:24px;background:linear-gradient(145deg,#fff,#f3eefb);box-shadow:0 12px 30px #49337712;padding:26px;gap:14px}.fc.back{background:linear-gradient(145deg,#eee5fb,#f9f4ff)}.fc img{width:min(100%,390px);max-height:300px;object-fit:contain;border-radius:17px}.fc .w1{font-size:clamp(24px,4vw,36px);letter-spacing:-.035em;color:#493377}.fc .h{font-size:12px;letter-spacing:.04em}.fcn{padding:6px 0;color:#6245ba}.tw{border:1px solid #e5deef;border-radius:14px}table{font-size:14px}th{background:#4b386e;padding:12px 15px}td{padding:11px 15px}tr:nth-child(even) td{background:#f9f7fc}.card{border:1px solid #e1d8ef}.big{font-size:clamp(44px,7vw,68px);letter-spacing:-.05em;color:#6245ba}.bar{height:9px;background:#eee9f6;margin:8px 0 15px}.bar i{background:linear-gradient(90deg,#7350ca,#a38be8);border-radius:20px}.rv{border-radius:12px;padding:14px 16px}.pane[style*="block"] section{animation:appear .32s ease-out}@keyframes appear{from{opacity:.55;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover){.btn:hover,.sec:hover{background:#e2d7f6}.go:hover{box-shadow:0 9px 24px #6844bc55}.it:hover{box-shadow:0 6px 20px #32254e0e}#tabs button:not(.on):hover{background:#eee8fa}.chip:hover{border-color:#9271d4}}
@media(max-width:600px){.w{padding:12px 12px 45px}header{padding:27px 22px;border-radius:22px}section{padding:17px;border-radius:20px}.grid{gap:12px}.fc{min-height:330px;padding:16px}.fc img{max-height:240px}#tabs{border-radius:12px}.it img{height:170px}.fcn .btn{padding:9px 13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<header><h1>Shopping 🛒</h1><p>Тренажёр к тесту: лексика + грамматика. Сначала пролистай карточки, потом выполни задания по порядку. В Matching и PC (выбор) проверяй ответы в конце раздела, в остальных — по одному. В конце можно повторить ошибки.</p>

<div id="app"></div>

<div id="res"></div>

S.splice(0,S.length,S[0],S[2],S[3],contS,contWrite,contFree,compChoose,compWrite,superChoose,{...superS,t:'Superlatives: впиши формы',tb:null,tip:null,it:superWrite},mixChoose,{...mixS,t:'Too / enough / as … as: впиши формы',n:'Впиши конструкцию целиком, используя подсказку в скобках.',k:'txt',tb:null,tip:null,it:mixWrite});

S.forEach((s,si)=>s.it.forEach((r,ri)=>{const o={si,id:'q'+si+'_'+ri,img:r[0],q:r[1],kind:s.k};
 if(s.k==='sel'){o.opts=r[2];o.ans=[r[3]];if(r[5]){o.kind='txt';o.ans=r[3]}}else o.ans=r[3];
 o.why=r[4]||W[o.ans[0]]||'Правильно: '+o.ans[0]+'.';items.push(o)}));
const app=document.getElementById('app');
const C=[['p2','check the price','проверить цену','He’s checking the price.'],['p4','stand in a queue','стоять в очереди','He’s standing in a queue.'],['p5','pay in cash','платить наличными','He’s paying in cash.'],['💳','pay by card','платить картой','She’s paying by card.'],['p6','get your change','получить сдачу','He’s getting his change.'],['p7','carry the shopping','нести покупки','He’s carrying the shopping.'],['p1','shopping basket','корзина для покупок','He’s taking a shopping basket.'],['p8','shopping bag','сумка для покупок','There are apples in the shopping bag.'],['trolley','shopping trolley','тележка для покупок','The trolley is full.'],['cashier','cashier','кассир · читается [кэ’шиэ], в конце «ie»','The cashier is friendly.'],['offer','special offer','акция, спецпредложение','Buy one, get one free — it’s a special offer!'],['🧾','receipt','чек · «p» не читается: [ри’сит]','Get a receipt!'],['📝','shopping list','список покупок','I’ve got a shopping list.']];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const SH=si=>{const a=items.filter(o=>o.si===si&&o.kind==='sel');return a.length&&a.every(o=>JSON.stringify(o.opts)===JSON.stringify(a[0].opts))?a[0].opts:null};
const chips=a=>shuf(a).map(x=>`<span class="chip" data-w="${esc(x)}">${esc(x)}</span>`).join('');
let ci=0,fl=false;
const pic=k=>IMG[k]?`<img alt="" src="${IMG[k]}">`:`<div class="e">${k}</div>`;

const TN=['📇 Карточки','1 Matching','2 Spelling','3 Gaps','4 PC · выбор','5 PC · формы','6 PC · свои','7 Comparative · выбор','8 Comparative · формы','9 Superlative · выбор','10 Superlative · формы','11 Too/enough · выбор','12 Too/enough · формы','📊 Результат'];
app.innerHTML=`<div class="pane"><section><h2>Знакомство со словами</h2><p class="note">Просто пролистай карточки: слово, картинка, перевод и пример. Потом переходи к заданиям.</p><div id="fc"></div><button class="go" onclick="go(1)">К заданиям →</button></section></div>`+S.map((s,si)=>`<div class="pane"><section><h2>${s.t}</h2><p class="note">${s.n}</p>${s.tb?`<div class="tw"><table>${s.tb}</table></div>`:''}${s.tip?`<div class="tip">💡 ${s.tip}</div>`:''}${SH(si)?`<div class="bank st">${chips(SH(si))}</div>`:''}<div class="grid">${items.filter(o=>o.si===si).map(o=>{
 let ctl=o.kind==='free'?`<textarea id="${o.id}" rows="3" placeholder="Напиши своё предложение"></textarea>`:o.kind==='sel'?`<button type="button" class="zone" id="${o.id}" data-ph="перетащи сюда"></button>${SH(si)?'':`<div class="bank">${chips(o.opts)}</div>`}`:`<input id="${o.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ">`;
 return `<div class="it" id="c_${o.id}">${o.img?pic(o.img):''}<p>${esc(o.q)}</p>${ctl}${s.batch?'':`<button type="button" class="btn check-one" onclick="checkOne('${o.id}')">${o.kind==='free'?'Показать пример':'Проверить ответ'}</button>`}<div class="fb" aria-live="polite"></div></div>`}).join('')}</div>${s.batch?`<button class="go" onclick="checkSection(${si})">Проверить ответы</button><p class="note" id="batch_${si}" aria-live="polite"></p>`:''}</section><button class="sec" onclick="${si<S.length-1?`go(${si+2})`:'check()'}">${si<S.length-1?'Дальше →':'Проверить всё →'}</button></div>`).join('');
document.getElementById('tabs').innerHTML=TN.map((x,i)=>`<button onclick="${i===TN.length-1?'check()':'go('+i+')'}">${x}</button>`).join('');
let retryMode=false,retryIds=new Set();
function applyRetry(){items.forEach(o=>{document.getElementById('c_'+o.id).style.display=retryMode&&!retryIds.has(o.id)?'none':'';});document.querySelectorAll('#tabs button').forEach((b,i)=>{b.style.display=retryMode&&i!==S.length+1&&!items.some(o=>o.si===i-1&&retryIds.has(o.id))?'none':'';});document.querySelectorAll('[id^="batch_"]').forEach(el=>el.textContent='');}
function go(n){if(retryMode&&n!==S.length+1){while(n<=S.length&&!items.some(o=>o.si===n-1&&retryIds.has(o.id)))n++;if(n>S.length){check();return;}}const L=S.length+1;document.querySelectorAll('.pane').forEach((p,i)=>p.style.display=i===n?'block':'none');document.getElementById('res').style.display=n===L?'block':'none';document.getElementById('chk').style.display=n===L?'none':'block';document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i===n));scrollTo({top:0})}
function checkOne(id){
 const o=items.find(x=>x.id===id),el=document.getElementById(id),c=document.getElementById('c_'+id),fb=c.querySelector('.fb');
 const val=el.value||''; if(!val.trim()){c.className='it';fb.textContent='Сначала введи или выбери ответ.';return;}
 if(o.kind==='free'){fb.textContent='Пример: '+o.ans[0]+' — сравни со своим предложением.';return;}
 const ok=o.ans.some(a=>N(a)===N(val));c.className='it '+(ok?'ok':'bad');fb.textContent=ok?'✓ Верно!':'✗ Попробуй ещё раз.';el.disabled=ok;
}
function checkSection(si){const group=items.filter(o=>o.si===si&&(!retryMode||retryIds.has(o.id)));let count=0;group.forEach(o=>{checkOne(o.id);if(o.ans.some(a=>N(a)===N(document.getElementById(o.id).value||'')))count++;});document.getElementById('batch_'+si).textContent=`Верно: ${count} / ${group.length}. ${count===group.length?'Отлично!':'Исправь ошибки и проверь снова.'}`;}

 retryMode=false;applyRetry();
 let sc=S.map(()=>[0,0]);
 items.forEach(o=>{const el=document.getElementById(o.id),c=document.getElementById('c_'+o.id);o.val=el.value||'';
  if(o.kind==='free')return; o.ok=o.ans.some(a=>N(a)===N(o.val));sc[o.si][1]++;if(o.ok)sc[o.si][0]++;
  c.className='it '+(o.ok?'ok':'bad');c.querySelector('.fb').textContent=o.ok?'✓ Верно':(el.value?'✗ Ошибка':'✗ Нет ответа');el.disabled=o.ok;});
 const tot=sc.reduce((a,b)=>a+b[0],0),max=items.filter(o=>o.kind!=='free').length,pct=Math.round(tot/max*100);
 const msg=pct>=90?'Отлично! Ты готов к тесту 🌟':pct>=70?'Хорошо! Повтори ошибки — и всё получится 👍':pct>=50?'Неплохо, но нужно ещё потренироваться 💪':'Нужно повторить тему. Начни с правил и таблиц выше 📚';
 const bad=items.filter(o=>o.kind!=='free'&&!o.ok);
 const r=document.getElementById('res');r.style.display='block';
 r.innerHTML=`<section class="card"><h2>Результат: ${esc(document.getElementById('nm').value||'ученик')}</h2><div class="big">${tot} / ${max} <span style="font-size:28px">(${pct}%)</span></div><p><b>${msg}</b></p><p class="note">${new Date().toLocaleDateString('ru-RU')} · попытка № ${attempt}</p>
 ${S.map((s,i)=>{if(s.k==='free')return `<div>${esc(s.t)} — самостоятельная практика, без автоматической оценки</div>`;const p=Math.round(sc[i][0]/sc[i][1]*100);return `<div>${s.t.split(':')[0]}: <b>${sc[i][0]}/${sc[i][1]}</b>${p<70?' — повторить':''}<div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 <h2>Работа над ошибками</h2>${bad.length?bad.map(o=>`<div class="rv">${esc(o.q)}<br>Твой ответ: <span class="y">${esc(o.val||'—')}</span><br>Попробуй ещё раз!</div>`).join(''):'<p>Ошибок нет! 🎉</p>'}
 <p class="note">Сделай скриншот этого блока и отправь учителю.</p></section>
 ${bad.length?'<button class="go" id="rt">Исправить ошибки ещё раз</button>':''}<button class="sec" id="rs">Начать заново</button>`;
 go(S.length+1);
 const rt=document.getElementById('rt');if(rt)rt.onclick=()=>{attempt++;bad.forEach(o=>{const el=document.getElementById(o.id);el.disabled=false;if(el.classList.contains('zone'))back(el);else el.value='';const c=document.getElementById('c_'+o.id);c.className='it';c.querySelector('.fb').textContent='';});retryMode=true;retryIds=new Set(bad.map(o=>o.id));applyRetry();go(bad[0].si+1);};
 document.getElementById('rs').onclick=()=>{retryMode=false;applyRetry();attempt=1;items.forEach(o=>{const el=document.getElementById(o.id);el.value='';el.disabled=false;if(el.classList.contains('zone'))back(el);const c=document.getElementById('c_'+o.id);c.className='it';c.querySelector('.fb').textContent=''});go(0);r.style.display='none';scrollTo({top:0,behavior:'smooth'})};
}
document.querySelectorAll('.chip').forEach(c=>c.home=c.parentNode);
let pick=null,drag=null;
function back(z){const c=z.querySelector('.chip');if(c)c.home.appendChild(c);z.value='';clearFeedback(z)}
function place(c,z){if(z.disabled||c.home.closest('.pane')!==z.closest('.pane')||(c.home.closest('.it')&&c.home.closest('.it')!==z.closest('.it')))return;const p=c.parentNode;if(p.classList.contains('zone')){p.value='';clearFeedback(p);}const old=z.querySelector('.chip');if(old&&old!==c)old.home.appendChild(old);z.appendChild(c);z.value=c.dataset.w;clearFeedback(z);c.classList.remove('pick');pick=null}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c||c.parentNode.disabled||c.classList.contains('ghost'))return;drag={c,x:e.clientX,y:e.clientY,g:null}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){const g=drag.c.cloneNode(true);g.className='chip ghost';document.body.appendChild(g);drag.g=g;drag.c.classList.add('lift')}if(drag.g){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px'}});

 if(g){g.remove();c.classList.remove('lift');const el=document.elementFromPoint(e.clientX,e.clientY),z=el&&el.closest('.zone');if(z&&!z.disabled)place(c,z);else if(inZ)back(c.parentNode)}
 else if(inZ){back(c.parentNode)}else{document.querySelectorAll('.chip.pick').forEach(x=>x.classList.remove('pick'));c.classList.add('pick');pick=c}});

document.getElementById('chk').onclick=check;drawC();go(0);
